<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Link do Instrutor</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--green:#177245;--red:#a33a3a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:820px;margin:auto}.top,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:18px 14px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}input[readonly]{background:#f3f6fa;color:#42536a}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.danger{background:#fff0ee;color:var(--red)}.muted{font-size:12px;color:var(--muted)}.linkbox{background:#f7fbff;border:1px solid #cfe0f1;border-radius:12px;padding:12px;margin-top:12px;word-break:break-all}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.status{font-weight:800}.active{color:var(--green)}.inactive{color:var(--red)}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><div>Link do instrutor</div></div><a class="btn secondary" href="./evaluations.html">Voltar às avaliações</a></div></header><main class="wrap"><section class="card"><h2 style="margin-top:0">Gerar acesso</h2><p class="muted">O instrutor recebe um único link do evento. Ao abrir, escolhe a turma e avalia os atletas sem usuário e sem senha.</p><div class="grid"><label><span>Evento</span><select id="eventSel"><option value="">Selecione...</option></select></label><label><span>Instrutor do evento</span><input id="guestName" placeholder="Selecione o evento"></label><label><span>Validade</span><select id="expiry"><option value="7">7 dias</option><option value="3">3 dias</option><option value="14">14 dias</option><option value="0">Sem prazo</option></select></label></div><div class="actions" style="justify-content:flex-start;margin-top:12px"><button id="generate" class="btn primary">Gerar link do instrutor</button></div><div id="newLink" class="linkbox hidden"><b>Link pronto</b><div id="linkText" style="margin:7px 0"></div><div class="actions" style="justify-content:flex-start"><button id="copy" class="btn secondary">Copiar link</button><a id="whatsapp" class="btn primary" target="_blank" rel="noopener">Enviar pelo WhatsApp</a></div></div></section><section class="card"><h2 style="margin-top:0">Links já gerados</h2><div id="links" class="muted">Selecione um evento para visualizar.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const $=id=>document.getElementById(id);let events=[],currentLink='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function publicLink(token){return `${location.origin}/guest-responses.html?t=${token}`}async function loadLinks(){const eventId=eventSel.value;if(!eventId){links.textContent='Selecione um evento para visualizar.';guestName.value='';guestName.readOnly=false;return}const r=await sb.from('evaluation_guest_links').select('id,event_id,guest_name,public_token,active,expires_at,created_at,teacher_id,teachers(name)').eq('event_id',eventId).order('created_at',{ascending:false});if(r.error){links.textContent=r.error.message;return}const data=r.data||[],knownName=data.map(x=>x.teachers?.name||x.guest_name).find(Boolean)||'';guestName.value=knownName;guestName.readOnly=!!knownName;guestName.placeholder=knownName?'':'Informe o instrutor somente na primeira vez';if(!data.length){links.innerHTML='<div class="muted">Nenhum link gerado para este evento.</div>';return}links.innerHTML=data.map(x=>{const name=x.teachers?.name||x.guest_name||'Instrutor',url=publicLink(x.public_token),expired=x.expires_at&&new Date(x.expires_at)<new Date(),on=x.active&&!expired;return `<div class="item"><b>${esc(name)}</b><div class="muted">${x.expires_at?'Válido até '+new Date(x.expires_at).toLocaleString('pt-BR'):'Sem prazo de expiração'}</div><div class="status ${on?'active':'inactive'}">${on?'Ativo':expired?'Expirado':'Desativado'}</div><div class="linkbox">${esc(url)}</div><div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="btn secondary" onclick="copyExisting('${url}')">Copiar</button>${on?`<button class="btn danger" onclick="revoke('${x.id}')">Desativar</button>`:`<button class="btn danger" onclick="deleteLink('${x.id}')">Excluir link</button>`}</div></div>`}).join('')}window.copyExisting=async url=>{await navigator.clipboard.writeText(url);alert('Link copiado.')};window.revoke=async id=>{if(!confirm('Desativar este link? O instrutor perderá o acesso imediatamente.'))return;const r=await sb.from('evaluation_guest_links').update({active:false,revoked_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await loadLinks()};window.deleteLink=async id=>{if(!confirm('Excluir definitivamente este link de acesso? As avaliações, respostas, observações e áudios já gravados serão preservados.'))return;const r=await sb.from('evaluation_guest_links').delete().eq('id',id).eq('active',false);if(r.error)return alert(r.error.message);await loadLinks()};eventSel.onchange=()=>{newLink.classList.add('hidden');loadLinks()};generate.onclick=async()=>{const eventId=eventSel.value,name=guestName.value.trim();if(!eventId)return alert('Selecione o evento.');if(!name)return alert('Este evento ainda não possui instrutor identificado. Informe o nome somente nesta primeira geração.');const days=Number(expiry.value),expires=days?new Date(Date.now()+days*86400000).toISOString():null;const r=await sb.from('evaluation_guest_links').insert({event_id:eventId,teacher_id:null,guest_name:name,expires_at:expires,active:true}).select().single();if(r.error)return alert(r.error.message);currentLink=publicLink(r.data.public_token);linkText.textContent=currentLink;newLink.classList.remove('hidden');const msg=`Olá, ${name}! Segue seu link do suBTo Experience para avaliar os atletas e responder às famílias. Não precisa de senha: ${currentLink}`;whatsapp.href=`https://wa.me/?text=${encodeURIComponent(msg)}`;await loadLinks()};copy.onclick=async()=>{await navigator.clipboard.writeText(currentLink);alert('Link copiado.')};async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const e=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});if(e.error)return alert(e.error.message);events=e.data||[];eventSel.innerHTML='<option value="">Selecione...</option>'+events.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.start_date||'')}</option>`).join('')}init();</script></body></html>
