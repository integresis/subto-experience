<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Pesquisa pós-evento</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#68758a;--green:#177245}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:720px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.athlete{font-size:20px;font-weight:900;color:var(--n);margin-top:8px}.q{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.q:first-child{border-top:0;margin-top:0;padding-top:0}.q h3{font-size:16px;margin:0 0 9px;color:var(--n)}.helper{font-size:12px;color:var(--muted);margin:-3px 0 9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;background:#fff;cursor:pointer}.choice:has(input:checked){border-color:var(--o);background:#fff8ed}.choice input{margin-right:5px}.rating{display:flex;gap:7px}.rating label{flex:1;text-align:center;border:1px solid #cbd5e1;border-radius:10px;padding:10px 4px;cursor:pointer}.rating label:has(input:checked){background:var(--o);color:#fff;border-color:var(--o)}.rating input{display:none}.matrix-row{margin:10px 0}.matrix-row b{display:block;font-size:13px;margin-bottom:5px}textarea{width:100%;min-height:85px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:900;background:var(--o);color:#fff;font-size:16px;cursor:pointer}.ok{text-align:center;padding:32px 18px}.ok h2{color:var(--green)}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Pesquisa pós-evento</div></div></header><main class="wrap"><div id="loading" class="card">Abrindo sua pesquisa...</div><div id="invalid" class="card hidden">Este link não está disponível.</div><section id="app" class="hidden"><div class="card"><b id="eventName"></b><div id="athleteName" class="athlete"></div><p id="intro" class="muted"></p></div><form id="form" class="card"><div id="questions"></div><button class="btn" type="submit">Enviar pesquisa</button></form></section><div id="thanks" class="card ok hidden"><h2>Obrigado! ✓</h2><p>Sua opinião e a voz do atleta ajudam a construir os próximos suBTo Experience.</p><p class="muted">Você pode abrir este mesmo link novamente enquanto a pesquisa estiver ativa caso queira ajustar alguma resposta.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('t');let data=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function val(a){return a==null?null:a}function rating(q,name){return `<div class="rating">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${name}" value="${n}" ${q.answer===n?'checked':''}>${n}</label>`).join('')}</div>`}function render(){eventName.textContent=data.event.name;athleteName.textContent=`Atleta: ${data.athlete.name}${data.athlete.category?' · '+data.athlete.category:''}`;intro.textContent=data.survey.intro_text||'';questions.innerHTML=data.questions.map(q=>{let body='',a=q.answer;if(q.type==='rating')body=rating(q,'q_'+q.id);else if(q.type==='multi_rating')body=(q.options||[]).map((o,i)=>`<div class="matrix-row"><b>${esc(o)}</b>${rating({answer:a?.[o]},'q_'+q.id+'_'+i)}</div>`).join('');else if(q.type==='multi_choice')body=`<div class="choices">${(q.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="q_${q.id}" value="${esc(o)}" ${Array.isArray(a)&&a.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;else if(q.type==='single_choice')body=`<div class="choices">${(q.options||[]).map(o=>`<label class="choice"><input type="radio" name="q_${q.id}" value="${esc(o)}" ${a===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`;else body=`<textarea name="q_${q.id}" placeholder="Escreva aqui...">${esc(typeof a==='string'?a:'')}</textarea>`;return `<div class="q" data-id="${q.id}" data-type="${q.type}" data-required="${q.required}"><h3>${q.position}. ${esc(q.label)}</h3>${q.helper_text?`<div class="helper">${esc(q.helper_text)}</div>`:''}${body}</div>`}).join('')}form.onsubmit=async e=>{e.preventDefault();const answers=[];for(const q of data.questions){let answer=null;if(q.type==='rating')answer=Number(document.querySelector(`input[name="q_${q.id}"]:checked`)?.value)||null;else if(q.type==='multi_rating'){answer={};(q.options||[]).forEach((o,i)=>{const x=document.querySelector(`input[name="q_${q.id}_${i}"]:checked`);if(x)answer[o]=Number(x.value)});if(q.required&&Object.keys(answer).length!==(q.options||[]).length)return alert('Avalie todos os itens da pergunta '+q.position+'.')}else if(q.type==='multi_choice')answer=[...document.querySelectorAll(`input[name="q_${q.id}"]:checked`)].map(x=>x.value);else if(q.type==='single_choice')answer=document.querySelector(`input[name="q_${q.id}"]:checked`)?.value||null;else answer=document.querySelector(`[name="q_${q.id}"]`).value.trim();if(q.required&&(answer==null||answer===''||(Array.isArray(answer)&&!answer.length)))return alert('Responda a pergunta '+q.position+'.');answers.push({question_id:q.id,answer:val(answer)})}const r=await sb.rpc('save_family_survey',{p_token:token,p_answers:answers,p_submit:true});if(r.error)return alert(r.error.message);app.classList.add('hidden');thanks.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};async function init(){if(!token){loading.classList.add('hidden');return invalid.classList.remove('hidden')}const r=await sb.rpc('get_family_survey',{p_token:token});loading.classList.add('hidden');if(r.error||!r.data)return invalid.classList.remove('hidden');data=r.data;app.classList.remove('hidden');render()}init();</script></body></html>
