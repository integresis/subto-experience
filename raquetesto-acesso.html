<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Minha conta</title><style>:root{--n:#0d1321;--l:#a6e22e;--b:#f5f6f8;--m:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,sans-serif;color:var(--n)}header{background:var(--n);color:#fff;padding:17px}.head,main{max-width:720px;margin:auto}.logo{font-size:22px;font-weight:900}.logo b{color:var(--l)}main{padding:20px 14px}.box,.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:26px;margin:0 0 5px}p{color:var(--m)}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px}button,a.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--l);color:var(--n);margin-top:13px}.secondary{background:#eef1f4;color:var(--n)}.danger{background:#fff1f0;color:#b42318}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef1f4}.price{font-size:19px;font-weight:900}.muted{color:var(--m);font-size:13px}.hidden{display:none}.notice{background:#fffbe8;border:1px solid #f2df8a;border-radius:10px;padding:10px;font-size:12px;margin-top:10px}</style></head><body><header><div class="head"><div class="logo">Raquetes<b>TO</b></div></div></header><main><section id="login" class="box"><h1>Minha conta</h1><p>Informe seu nome e WhatsApp. Você receberá um código para confirmar que o número é seu.</p><label>Nome</label><input id="name" autocomplete="name"><label>WhatsApp</label><input id="phone" inputmode="tel" placeholder="(63) 99999-9999"><button class="primary" onclick="requestCode()">Receber código</button><div id="codeArea" class="hidden"><label>Código de 6 dígitos</label><input id="code" inputmode="numeric" maxlength="6"><div id="dev" class="notice"></div><button class="primary" onclick="verifyCode()">Confirmar e entrar</button></div><p id="msg"></p></section><section id="panel" class="hidden"><div class="box"><div class="row" style="justify-content:space-between"><div><h1>Minhas raquetes</h1><div id="hello" class="muted"></div></div><div class="row"><a class="btn primary" href="raquetesto-anunciar.html">+ Anunciar</a><button class="secondary" onclick="logout()">Sair</button></div></div></div><div id="list"></div></section></main><script>const API='https://jaclntjjlzoumzkoiqgv.supabase.co/functions/v1/raquetesto-access';let requestToken=null;const $=id=>document.getElementById(id);async function call(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.json()}async function requestCode(){const name=$('name').value.trim(),whatsapp=$('phone').value;if(name.length<2){$('msg').textContent='Informe seu nome.';return}const x=await call({action:'request_code',whatsapp});if(x.error){$('msg').textContent=x.error;return}requestToken=x.request_token;$('codeArea').classList.remove('hidden');$('dev').textContent='Durante o MVP, antes da integração com WhatsApp, seu código de teste é: '+x.dev_code}async function verifyCode(){const x=await call({action:'verify_code',name:$('name').value.trim(),whatsapp:$('phone').value,request_token:requestToken,code:$('code').value});if(x.error){$('msg').textContent=x.error;return}localStorage.setItem('rt_session',x.session);localStorage.setItem('rt_user',JSON.stringify(x.user));showPanel()}function logout(){localStorage.removeItem('rt_session');localStorage.removeItem('rt_user');location.reload()}async function showPanel(){const s=localStorage.getItem('rt_session'),u=JSON.parse(localStorage.getItem('rt_user')||'null');if(!s||!u)return;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('hello').textContent=u.name+' · '+u.whatsapp;await load()}async function load(){const x=await call({action:'my_listings',session:localStorage.getItem('rt_session')});if(x.error){$('list').innerHTML='<div class="box">Sessão expirada. Entre novamente.</div>';return}if(!x.data?.length){$('list').innerHTML='<div class="box"><strong>Você ainda não anunciou nenhuma raquete.</strong><p>Quando anunciar, poderá pausar, reativar ou marcar como vendida por aqui.</p></div>';return}$('list').innerHTML=x.data.map(r=>`<div class="item"><div class="row" style="justify-content:space-between"><strong>${r.raquetesto_brands?.name||r.brand_other||''} ${r.model}</strong><span class="status">${r.status}</span></div><div class="price">${r.price?Number(r.price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Troca'}</div><div class="muted">${r.weight_g} g${r.balance_cm?' · '+r.balance_cm+' cm':''} · ${r.city}/${r.state}</div><div class="row" style="margin-top:12px">${r.status!=='active'?'<button class="primary" onclick="status(\''+r.id+'\',\'active\')">Ativar</button>':'<button class="secondary" onclick="status(\''+r.id+'\',\'paused\')">Pausar</button>'}<button class="secondary" onclick="status('${r.id}','sold')">Marcar vendida</button></div></div>`).join('')}async function status(id,status){await call({action:'set_status',session:localStorage.getItem('rt_session'),id,status});load()}showPanel();</script></body></html>
