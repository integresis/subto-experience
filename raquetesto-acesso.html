<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Minha conta</title><style>:root{--n:#0d1321;--l:#a6e22e;--b:#f5f6f8;--m:#667085;--line:#e5e7eb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,sans-serif;color:var(--n)}header{background:var(--n);color:#fff;padding:14px 16px}.head,main{max-width:720px;margin:auto}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.brand b{color:var(--l)}main{padding:20px 14px}.box,.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:26px;margin:0 0 5px}p{color:var(--m);line-height:1.45}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px}button,a.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--l);color:var(--n)}.secondary{background:#eef1f4;color:var(--n)}.linkbtn{background:none;padding:9px 0;color:#344054;text-decoration:underline}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f2f4f7;padding:5px;border-radius:12px;margin:14px 0}.tab{background:transparent}.tab.on{background:#fff}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef1f4}.price{font-size:19px;font-weight:900}.muted{color:var(--m);font-size:13px}.hidden{display:none}.msg{font-size:13px;color:var(--red);margin-top:10px}.listing{display:grid;grid-template-columns:92px 1fr;gap:14px}.thumb{width:92px;aspect-ratio:1;border-radius:12px;background:#eef1f4;overflow:hidden;display:grid;place-items:center;color:#98a2b3;font-size:12px}.thumb img{width:100%;height:100%;object-fit:cover}.info{min-width:0}.title{font-weight:900;font-size:17px}.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}@media(max-width:480px){.listing{grid-template-columns:78px 1fr}.thumb{width:78px}}</style></head><body><header><div class="head"><a href="raquetesto.html" class="brand">Raquetes<b>TO</b></a></div></header><main><section id="auth" class="box"><h1>Minha conta</h1><p id="intro">Entre com seu e-mail e senha.</p><div class="tabs"><button id="tl" class="tab on" onclick="mode('login')">Já tenho acesso</button><button id="tr" class="tab" onclick="mode('register')">Primeiro acesso</button></div><div id="reg" class="hidden"><label>Seu nome</label><input id="name" autocomplete="name"><label>WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="(63) 99999-9999"></div><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"><button id="forgot" class="linkbtn" onclick="recover()">Esqueci minha senha</button><button id="go" class="primary" style="width:100%;margin-top:8px" onclick="submitAuth()">Entrar</button><div id="msg" class="msg"></div></section><section id="panel" class="hidden"><div class="box"><div class="row" style="justify-content:space-between"><div><h1>Minhas raquetes</h1><div id="hello" class="muted"></div></div><div class="row"><a class="btn primary" href="raquetesto-anunciar.html">+ Anunciar</a><a class="btn secondary" href="raquetesto.html">Ver vitrine</a><button class="secondary" onclick="logout()">Sair</button></div></div></div><div id="list"></div></section></main><script>const API='https://jaclntjjlzoumzkoiqgv.supabase.co/functions/v1/raquetesto-access',PUBLIC='https://jaclntjjlzoumzkoiqgv.supabase.co/storage/v1/object/public/raquetesto-photos/',$=id=>document.getElementById(id);let current='login';async function call(body){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return await r.json()}catch{return{error:'Não foi possível conectar.'}}}function mode(m){current=m;$('tl').classList.toggle('on',m==='login');$('tr').classList.toggle('on',m==='register');$('reg').classList.toggle('hidden',m==='login');$('forgot').classList.toggle('hidden',m==='register');$('go').textContent=m==='login'?'Entrar':'Criar meu acesso';$('intro').textContent=m==='login'?'Entre com seu e-mail e senha.':'Informe nome, e-mail, WhatsApp e escolha sua senha.';$('msg').textContent=''}async function submitAuth(){$('go').disabled=true;$('msg').textContent='';if(current==='register'){const x=await call({action:'register',name:$('name').value,email:$('email').value,whatsapp:$('phone').value,password:$('password').value});$('go').disabled=false;if(x.error){$('msg').textContent=x.error;return}current='login';const l=await call({action:'login',email:$('email').value,password:$('password').value});if(l.error){$('msg').textContent='Cadastro criado. Entre com seu e-mail e senha.';mode('login');return}save(l);return}const x=await call({action:'login',email:$('email').value,password:$('password').value});$('go').disabled=false;if(x.error){$('msg').textContent=x.error;return}save(x)}function save(x){localStorage.setItem('rt_session',x.session);localStorage.setItem('rt_user',JSON.stringify(x.user));showPanel()}async function recover(){const email=$('email').value.trim();if(!email){$('msg').textContent='Informe seu e-mail primeiro.';return}const x=await call({action:'request_password_reset',email});$('msg').style.color=x.error?'#b42318':'#067647';$('msg').textContent=x.error||x.message}function logout(){localStorage.removeItem('rt_session');localStorage.removeItem('rt_user');location.reload()}async function showPanel(){const s=localStorage.getItem('rt_session'),u=JSON.parse(localStorage.getItem('rt_user')||'null');if(!s||!u)return;$('auth').classList.add('hidden');$('panel').classList.remove('hidden');$('hello').textContent=u.name+' · '+u.email;await load()}const labels={active:'Disponível',negotiating:'Em negociação',paused:'Pausada',sold:'Vendida',unavailable:'Indisponível'};async function load(){const x=await call({action:'my_listings',session:localStorage.getItem('rt_session')});if(x.error){$('list').innerHTML='<div class="box">Sessão expirada. Entre novamente.</div>';return}if(!x.data?.length){$('list').innerHTML='<div class="box">Você ainda não anunciou nenhuma raquete.</div>';return}$('list').innerHTML=x.data.map(r=>{const p=(r.raquetesto_listing_photos||[]).sort((a,b)=>a.position-b.position)[0],src=p?PUBLIC+p.storage_path:'';return `<div class="item"><div class="listing"><div class="thumb">${src?`<img src="${src}">`:'Sem foto'}</div><div class="info"><div class="row" style="justify-content:space-between"><div class="title">${r.raquetesto_brands?.name||r.brand_other||''} ${r.model}</div><span class="status">${labels[r.status]||r.status}</span></div><div class="price">${r.price?Number(r.price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Troca'}</div><div class="muted">${r.weight_g} g · ${r.city}/${r.state}</div><div class="actions">${r.status!=='active'?`<button class="primary" onclick="setStatus('${r.id}','active')">Disponibilizar</button>`:`<button class="secondary" onclick="setStatus('${r.id}','negotiating')">Em negociação</button>`}<button class="secondary" onclick="setStatus('${r.id}','paused')">Pausar</button><button class="secondary" onclick="setStatus('${r.id}','sold')">Vendida</button></div></div></div></div>`}).join('')}async function setStatus(id,status){const text=status==='sold'?'Marcar esta raquete como vendida?':status==='negotiating'?'Marcar como em negociação?':null;if(text&&!confirm(text))return;await call({action:'set_status',session:localStorage.getItem('rt_session'),id,status});load()}if(localStorage.getItem('rt_session')&&localStorage.getItem('rt_user'))showPanel();</script></body></html>
