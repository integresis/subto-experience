<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Instrutores</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1f2f49}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 16px}.wrap{max-width:1000px;margin:auto}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:18px 14px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.danger{background:#fff0ee;color:var(--red)}.muted{font-size:13px;color:var(--muted)}.hidden{display:none!important}.moment-list{display:grid;gap:7px;margin-top:10px}.moment{display:flex;gap:8px;align-items:flex-start;border:1px solid #e6ebf1;border-radius:10px;padding:9px}.moment input{width:auto;margin-top:3px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #edf1f5;padding:10px 0}.row:last-child{border-bottom:0}.status{font-size:12px;font-weight:800}.ok{color:#067647}.err{color:var(--red)}@media(max-width:700px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start}}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><div>Instrutores convidados</div></div><a href="./modules.html" class="btn secondary">Módulos</a></div></header><main class="wrap"><div id="blocked" class="card hidden">Acesso restrito.</div><section id="app" class="hidden"><div class="card"><h2>Novo instrutor</h2><div class="grid"><label><span>Nome</span><input id="name"></label><label><span>E-mail</span><input id="email" type="email"></label><label><span>Senha inicial</span><input id="password" type="password" placeholder="Mínimo 8 caracteres"></label><label><span>Evento</span><select id="eventSel"><option value="">Selecione</option></select></label></div><div id="momentChoices" class="moment-list"></div><div class="actions" style="justify-content:flex-start;margin-top:12px"><button id="createBtn" class="btn primary">Criar instrutor</button><span id="createStatus" class="status"></span></div><p class="muted">O instrutor não recebe acesso administrativo. Ele entra por uma tela separada e vê somente as turmas liberadas.</p></div><div class="card"><h2>Instrutores cadastrados</h2><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let events=[],moments=[],instructors=[],access=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return blocked.classList.remove('hidden');const{data:ok}=await sb.rpc('is_admin');if(!ok)return blocked.classList.remove('hidden');app.classList.remove('hidden');const{data:e,error}=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});if(error)return alert(error.message);events=e||[];eventSel.innerHTML='<option value="">Selecione</option>'+events.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');await loadList()}eventSel.onchange=async()=>{momentChoices.innerHTML='';if(!eventSel.value)return;const{data,error}=await sb.from('event_moments').select('id,name,location,start_time,activity_date').eq('event_id',eventSel.value).order('activity_date').order('start_time');if(error)return alert(error.message);moments=data||[];momentChoices.innerHTML=moments.length?'':'<div class="muted">Este evento ainda não possui turmas.</div>';moments.forEach(m=>momentChoices.insertAdjacentHTML('beforeend',`<label class="moment"><input type="checkbox" data-moment="${m.id}"><span><strong>${esc(m.name)}</strong><br><span class="muted">${esc(m.location)} · ${String(m.start_time).slice(0,5)}</span></span></label>`))};createBtn.onclick=async()=>{createStatus.textContent='';const n=name.value.trim(),e=email.value.trim(),p=password.value,ids=[...document.querySelectorAll('[data-moment]:checked')].map(x=>x.dataset.moment);if(!n||!e||p.length<8){createStatus.textContent='Preencha nome, e-mail e uma senha com ao menos 8 caracteres.';createStatus.className='status err';return}createBtn.disabled=true;const{data,error}=await sb.functions.invoke('admin-create-instructor',{body:{name:n,email:e,password:p,moment_ids:ids}});createBtn.disabled=false;if(error||data?.error){createStatus.textContent=data?.error||error.message;createStatus.className='status err';return}createStatus.textContent='Instrutor criado com sucesso.';createStatus.className='status ok';name.value='';email.value='';password.value='';document.querySelectorAll('[data-moment]').forEach(x=>x.checked=false);await loadList()};async function loadList(){const[i,a]=await Promise.all([sb.from('instructor_accounts').select('*').order('name'),sb.from('instructor_moment_access').select('*')]);if(i.error||a.error)return alert((i.error||a.error).message);instructors=i.data||[];access=a.data||[];list.innerHTML=instructors.length?'':'<div class="muted">Nenhum instrutor cadastrado.</div>';for(const ins of instructors){const ids=access.filter(x=>x.instructor_id===ins.id).map(x=>x.moment_id);const{data:ms}=ids.length?await sb.from('event_moments').select('id,name,location,start_time,event_id').in('id',ids):{data:[]};const desc=(ms||[]).map(m=>`${m.name} · ${m.location} · ${String(m.start_time).slice(0,5)}`).join(' | ')||'Nenhuma turma liberada';list.insertAdjacentHTML('beforeend',`<div class="row"><div><strong>${esc(ins.name)}</strong><br><span class="muted">${esc(ins.email)}</span><br><span class="muted">${esc(desc)}</span></div><span class="status ${ins.active?'ok':'err'}">${ins.active?'Ativo':'Inativo'}</span></div>`)}}init();</script></body></html>
