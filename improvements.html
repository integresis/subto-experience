<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>suBTo Experience — Melhorias e Pendências</title>
<style>
:root{--navy:#082657;--orange:#f28a00;--bg:#f5f7fa;--ink:#1f2f49;--muted:#6b7587;--line:#dde4ed;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),#104488);color:#fff;padding:22px 16px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.brand b{color:var(--orange)}header p{margin:5px 0 0;opacity:.85}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#eaf0f7;color:var(--navy);text-decoration:none;display:inline-block}.btn.primary{background:var(--orange);color:#fff}.btn.small{padding:8px 10px;font-size:12px}.hidden{display:none!important}main{padding:24px 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #0826570c;margin-bottom:16px}.panel h2{margin:0 0 14px;color:var(--navy)}.form-grid,.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}input,select,textarea{width:100%;border:1px solid #cfd8e5;border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0 0 5px;color:var(--navy);font-size:18px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.desc{white-space:pre-wrap;margin:12px 0;line-height:1.5}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border-radius:999px;padding:6px 9px;background:#eef3f8;font-size:11px;font-weight:800}.chip.high,.chip.urgent{background:#fff0ed;color:#a33}.chip.medium{background:#fff4df;color:#855200}.empty,.loading{text-align:center;color:var(--muted);padding:24px}.count{color:var(--muted);font-size:13px}.error{background:#fff0ed;color:#9a2c20;border:1px solid #ffd0c9;border-radius:12px;padding:11px;margin-top:12px}.success{background:#edf8f0;color:#226b35;border:1px solid #cdebd5;border-radius:12px;padding:11px;margin-top:12px}@media(max-width:680px){.form-grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.top,.item-top{align-items:flex-start}.item-top{flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><p>Melhorias e Pendências</p></div><a class="btn" href="./modules.html">Módulos</a></div></header>
<main class="wrap">
<div id="loading" class="panel loading">Validando acesso...</div>
<div id="app" class="hidden">
<section class="panel"><h2>Novo registro</h2><div class="form-grid">
<div class="full"><label for="title">Título</label><input id="title" maxlength="160" placeholder="Ex.: Melhorar o planejamento de eventos"></div>
<div class="full"><label for="description">O que precisa ser feito?</label><textarea id="description" placeholder="Registre aqui a ideia, problema, ajuste ou melhoria para não perdermos essa necessidade."></textarea></div>
<div><label for="module">Módulo relacionado</label><input id="module" maxlength="120" placeholder="Ex.: Planejamento"></div>
<div><label for="itemType">Tipo</label><select id="itemType"><option value="improvement">Melhoria</option><option value="problem">Problema</option><option value="idea">Ideia</option><option value="adjustment">Ajuste</option></select></div>
<div><label for="priority">Prioridade</label><select id="priority"><option value="low">Baixa</option><option value="medium" selected>Média</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></div>
<div><label for="dueDate">Previsão de entrega</label><input id="dueDate" type="date"></div>
</div><div class="actions"><button id="save" class="btn primary">Registrar</button></div><div id="formMsg"></div></section>
<section class="panel"><div class="item-top"><h2>Registros</h2><span id="count" class="count"></span></div><div class="filters">
<div><label for="filterModule">Módulo</label><select id="filterModule"><option value="">Todos</option></select></div>
<div><label for="filterStatus">Status</label><select id="filterStatus"><option value="">Todos</option><option value="registered">Registrado</option><option value="analysis">Em análise</option><option value="approved">Aprovado</option><option value="development">Em desenvolvimento</option><option value="completed">Concluído</option><option value="archived">Arquivado</option></select></div>
<div><label for="filterPriority">Prioridade</label><select id="filterPriority"><option value="">Todas</option><option value="urgent">Urgente</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select></div>
<div><label for="filterType">Tipo</label><select id="filterType"><option value="">Todos</option><option value="improvement">Melhoria</option><option value="problem">Problema</option><option value="idea">Ideia</option><option value="adjustment">Ajuste</option></select></div>
</div></section><div id="list" class="list"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');
const labels={item_type:{improvement:'Melhoria',problem:'Problema',idea:'Ideia',adjustment:'Ajuste'},priority:{low:'Baixa',medium:'Média',high:'Alta',urgent:'Urgente'},status:{registered:'Registrado',analysis:'Em análise',approved:'Aprovado',development:'Em desenvolvimento',completed:'Concluído',archived:'Arquivado'}};
let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'Sem previsão';
const fmtTime=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
function setMsg(text,type='error'){formMsg.innerHTML=text?`<div class="${type}">${esc(text)}</div>`:''}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const {data:ok,error}=await sb.rpc('is_admin');if(error||!ok){await sb.auth.signOut();return location.replace('./login.html')}loading.classList.add('hidden');app.classList.remove('hidden');await load()}
async function load(){list.innerHTML='<div class="panel loading">Carregando registros...</div>';const {data,error}=await sb.from('improvement_backlog').select('id,title,description,module,item_type,priority,status,due_date,created_at,updated_at').order('created_at',{ascending:false});if(error){list.innerHTML=`<div class="panel error">${esc(error.message)}</div>`;return}rows=data||[];fillModules();render()}
function fillModules(){const current=filterModule.value;const mods=[...new Set(rows.map(r=>(r.module||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));filterModule.innerHTML='<option value="">Todos</option>'+mods.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');if(mods.includes(current))filterModule.value=current}
function filtered(){return rows.filter(r=>(!filterModule.value||r.module===filterModule.value)&&(!filterStatus.value||r.status===filterStatus.value)&&(!filterPriority.value||r.priority===filterPriority.value)&&(!filterType.value||r.item_type===filterType.value))}
function render(){const data=filtered();count.textContent=`${data.length} registro${data.length===1?'':'s'}`;if(!data.length){list.innerHTML='<div class="panel empty">Nenhum registro encontrado.</div>';return}list.innerHTML=data.map(r=>`<article class="item"><div class="item-top"><div><h3>${esc(r.title)}</h3><div class="meta">${esc(r.module||'Sem módulo definido')} · criado em ${esc(fmtTime(r.created_at))} · previsão: ${esc(fmtDate(r.due_date))}</div></div><div class="chips"><span class="chip">${esc(labels.item_type[r.item_type]||r.item_type)}</span><span class="chip ${esc(r.priority)}">${esc(labels.priority[r.priority]||r.priority)}</span></div></div><div class="desc">${esc(r.description)}</div><div class="form-grid"><div><label>Status</label><select onchange="updateStatus('${r.id}',this.value)">${Object.entries(labels.status).map(([v,l])=>`<option value="${v}" ${r.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Prioridade</label><select onchange="updatePriority('${r.id}',this.value)">${Object.entries(labels.priority).map(([v,l])=>`<option value="${v}" ${r.priority===v?'selected':''}>${l}</option>`).join('')}</select></div></div></article>`).join('')}
async function updateStatus(id,status){const {error}=await sb.from('improvement_backlog').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()}
async function updatePriority(id,priority){const {error}=await sb.from('improvement_backlog').update({priority,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()}
save.onclick=async()=>{setMsg('');const t=title.value.trim(),d=description.value.trim();if(t.length<3||d.length<3)return setMsg('Informe um título e descreva o que precisa ser feito.');save.disabled=true;const {data:{session}}=await sb.auth.getSession();const payload={title:t,description:d,module:module.value.trim()||null,item_type:itemType.value,priority:priority.value,status:'registered',due_date:dueDate.value||null,created_by:session.user.id};const {error}=await sb.from('improvement_backlog').insert(payload);save.disabled=false;if(error)return setMsg(error.message);title.value='';description.value='';module.value='';itemType.value='improvement';priority.value='medium';dueDate.value='';setMsg('Registro salvo.','success');await load()};
[filterModule,filterStatus,filterPriority,filterType].forEach(el=>el.onchange=render);init();
</script></body></html>
