<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Nova senha</title><style>body{margin:0;background:#f5f6f8;font-family:Arial;color:#0d1321}main{max-width:480px;margin:50px auto;padding:14px}.box{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px}h1{margin-top:0}.field{position:relative;margin:6px 0 12px}.field input{width:100%;box-sizing:border-box;padding:13px 52px 13px 13px;border:1px solid #e5e7eb;border-radius:11px;font-size:16px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:#667085;font-size:20px;cursor:pointer;padding:0}.save{width:100%;border:0;border-radius:11px;padding:13px;background:#a6e22e;color:#0d1321;font-weight:900;font-size:16px;cursor:pointer}.msg{margin-top:12px;color:#667085}.msg a{color:#0d1321;font-weight:700}</style></head><body><main><div class="box"><h1>Crie sua nova senha</h1><p>Escolha uma senha com pelo menos 6 caracteres.</p><div class="field"><input id="p1" type="password" placeholder="Nova senha" autocomplete="new-password"><button class="toggle" type="button" onclick="togglePassword('p1',this)" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div><div class="field"><input id="p2" type="password" placeholder="Repita a nova senha" autocomplete="new-password"><button class="toggle" type="button" onclick="togglePassword('p2',this)" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div><button class="save" onclick="save()">Salvar nova senha</button><div id="msg" class="msg">Validando seu link…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),msg=document.getElementById('msg');function togglePassword(id,btn){const input=document.getElementById(id),show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'🙈':'👁';btn.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');btn.title=show?'Ocultar senha':'Mostrar senha'}function traduzErro(text=''){const t=text.toLowerCase();if(t.includes('new password should be different from the old password'))return 'A nova senha precisa ser diferente da senha anterior.';if(t.includes('password should be at least'))return 'A senha precisa ter pelo menos 6 caracteres.';if(t.includes('same password'))return 'A nova senha precisa ser diferente da senha anterior.';if(t.includes('session')&&t.includes('missing'))return 'Seu link de recuperação não é mais válido. Solicite um novo.';if(t.includes('expired'))return 'Este link expirou. Solicite um novo em “Esqueci minha senha”.';return 'Não foi possível alterar a senha. Tente novamente ou solicite um novo link.'}async function ready(){const hash=new URLSearchParams(location.hash.slice(1)),access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh)await sb.auth.setSession({access_token:access,refresh_token:refresh});const {data}=await sb.auth.getSession();msg.textContent=data.session?'Link confirmado. Digite sua nova senha.':'Este link não é válido ou expirou. Solicite outro em “Esqueci minha senha”.'}async function save(){const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<6)return msg.textContent='Use pelo menos 6 caracteres.';if(a!==b)return msg.textContent='As senhas não coincidem.';const {error}=await sb.auth.updateUser({password:a});if(error)return msg.textContent=traduzErro(error.message);msg.innerHTML='Senha alterada com sucesso. <a href="raquetesto-acesso.html">Entrar no RaquetesTO</a>.'}ready();</script></body></html>
