<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Nova senha</title><style>body{margin:0;background:#f5f6f8;font-family:Arial;color:#0d1321}main{max-width:480px;margin:50px auto;padding:14px}.box{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px}h1{margin-top:0}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:11px;font-size:16px;margin:6px 0 12px}button{width:100%;border:0;border-radius:11px;padding:13px;background:#a6e22e;color:#0d1321;font-weight:900}.msg{margin-top:12px;color:#667085}</style></head><body><main><div class="box"><h1>Crie sua nova senha</h1><p>Escolha uma senha com pelo menos 6 caracteres.</p><input id="p1" type="password" placeholder="Nova senha"><input id="p2" type="password" placeholder="Repita a nova senha"><button onclick="save()">Salvar nova senha</button><div id="msg" class="msg">Validando seu link…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),msg=document.getElementById('msg');async function ready(){const hash=new URLSearchParams(location.hash.slice(1)),access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh)await sb.auth.setSession({access_token:access,refresh_token:refresh});const {data}=await sb.auth.getSession();msg.textContent=data.session?'Link confirmado. Digite sua nova senha.':'Este link não é válido ou expirou. Solicite outro em “Esqueci minha senha”.'}async function save(){const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<6)return msg.textContent='Use pelo menos 6 caracteres.';if(a!==b)return msg.textContent='As senhas não coincidem.';const {error}=await sb.auth.updateUser({password:a});if(error)return msg.textContent=error.message;msg.innerHTML='Senha alterada. <a href="raquetesto-acesso.html">Entrar no RaquetesTO</a>.'}ready();</script></body></html>
