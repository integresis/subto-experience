<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Encerramento da pesquisa</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#68758a;--green:#177245}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:720px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}label{display:block;font-weight:800;margin-bottom:12px}select,input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:900;background:var(--o);color:#fff;font-size:16px;cursor:pointer}.muted{color:var(--muted);font-size:13px}.ok{color:var(--green);font-weight:800;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Encerramento da pesquisa</div></div></header><main class="wrap"><div class="card"><label>Pesquisa / evento<select id="survey"><option value="">Carregando...</option></select></label><div class="grid"><label>Data<input id="date" type="date"></label><label>Hora<input id="time" type="time" value="00:00"></label></div><button id="save" class="btn">Programar encerramento</button><div id="status" class="muted" style="margin-top:12px"></div></div><div class="card muted">O horário informado é considerado no horário de Palmas/TO (UTC−3). Todos os links ativos da pesquisa serão encerrados automaticamente no mesmo momento.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),survey=document.getElementById('survey'),date=document.getElementById('date'),time=document.getElementById('time'),status=document.getElementById('status'),save=document.getElementById('save');async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='./admin-login.html';const {data,error}=await sb.from('event_surveys').select('id,title,event_id,events(name)').eq('active',true).order('created_at',{ascending:false});if(error){status.textContent=error.message;return}survey.innerHTML='<option value="">Selecione...</option>'+data.map(x=>`<option value="${x.id}">${x.events?.name||'Evento'} · ${x.title}</option>`).join('')}save.onclick=async()=>{if(!survey.value||!date.value||!time.value)return alert('Selecione a pesquisa, a data e a hora.');const local=`${date.value}T${time.value}:00-03:00`;if(!confirm(`Programar o encerramento para ${date.value.split('-').reverse().join('/')} às ${time.value}?`))return;save.disabled=true;status.textContent='Salvando...';const {data,error}=await sb.rpc('set_family_survey_expiration',{p_survey_id:survey.value,p_expires_at:local});save.disabled=false;if(error){status.textContent='Não foi possível programar: '+error.message;return}status.className='ok';status.textContent=`Encerramento programado para ${date.value.split('-').reverse().join('/')} às ${time.value}. ${data} link(s) atualizado(s).`};init();</script></body></html>
