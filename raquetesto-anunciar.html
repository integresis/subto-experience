<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Anunciar</title><style>:root{--n:#0d1321;--l:#a6e22e;--b:#f5f6f8;--m:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,sans-serif;color:var(--n)}header{background:var(--n);padding:14px 16px}.head,main{max-width:760px;margin:auto}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.mark{width:40px;height:40px}.word{font-size:22px;font-weight:900}.word b{color:var(--l)}.tag{font-size:9px;letter-spacing:1.4px;color:#d0d5dd}main{padding:18px 14px 50px}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 5px;font-size:27px}p{color:var(--m);line-height:1.45}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{border:0;border-radius:11px;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:var(--l);color:var(--n)}.secondary{background:#eef1f4;color:var(--n)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.checks{display:flex;gap:8px;align-items:center;margin-top:12px}.checks input{width:auto}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.preview{aspect-ratio:1;border:1px dashed #cbd1da;border-radius:11px;overflow:hidden;background:#f7f8fa;display:grid;place-items:center;color:#98a2b3;font-size:12px}.preview img{width:100%;height:100%;object-fit:cover}.msg{margin-top:10px;font-size:13px;color:#b42318}.ok{background:#f4f9e8;border:1px solid #cde783;color:#39510a;padding:12px;border-radius:12px}.hidden{display:none}.other{margin-top:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><div class="head"><a href="raquetesto.html" class="brand"><svg class="mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff"/><path d="M17 13h20c10 0 17 6 17 15 0 8-5 13-12 15l10 8H38L27 41v10H17V13zm10 9v11h10c4 0 7-2 7-6 0-3-3-5-7-5H27z" fill="#0d1321"/><path d="M39 9c9 2 16 9 18 18l-9 3c-1-6-5-10-11-12z" fill="#a6e22e"/></svg><div><div class="word">Raquetes<b>TO</b></div><div class="tag">ENCONTRE. ANUNCIE. JOGUE.</div></div></a></div></header><main><div class="box"><div class="row" style="justify-content:space-between"><div><h1>Anunciar raquete</h1><p style="margin:4px 0">Cadastro rápido para Beach Tennis.</p></div><a href="raquetesto-acesso.html"><button class="secondary">Minhas raquetes</button></a></div></div><form id="form" class="box"><div class="grid"><div><label>Marca *</label><select id="brand" required><option>Carregando marcas...</option></select><input id="brandOther" class="other hidden" placeholder="Digite a marca"></div><div><label>Modelo *</label><input id="model" required></div><div><label>Ano do modelo</label><input id="year" inputmode="numeric" placeholder="2026"></div><div><label>Condição *</label><select id="condition"><option value="usada">Usada</option><option value="nova">Nova</option></select></div><div><label>Negociação *</label><select id="negotiation"><option value="venda">Venda</option><option value="venda_ou_troca">Venda ou troca</option><option value="troca">Troca</option></select></div><div><label>Preço (R$)</label><input id="price" inputmode="decimal" placeholder="1500,00"></div><div><label>Peso (g) *</label><input id="weight" inputmode="decimal" required placeholder="330"></div><div><label>Balance (cm)</label><input id="balance" inputmode="decimal" placeholder="26,2"></div><div><label>Espessura (mm)</label><select id="thickness"><option value="">Não informar</option><option>20</option><option>21</option><option>22</option><option value="other">Outra</option></select><input id="thicknessOther" class="other hidden" inputmode="decimal" placeholder="Espessura em mm"></div><div><label>Material da face</label><select id="material"><option value="">Não informar</option><option>Fibra de vidro</option><option>Carbono</option><option>3K</option><option>6K</option><option>12K</option><option>15K</option><option>18K</option><option>24K</option><option>Carbono forjado</option><option>Carbono + Kevlar</option><option>Kevlar</option><option>Outro</option></select></div><div><label>Cidade *</label><input id="city" required placeholder="Palmas"></div><div><label>UF *</label><input id="state" maxlength="2" value="TO" required></div></div><label>Acessórios incluídos</label><input id="accessories" placeholder="Capa, protetor de cabeça, cushion..."><label>Descrição</label><textarea id="description" maxlength="600" placeholder="Estado da raquete, tempo de uso e informações importantes."></textarea><label>Fotos — até 4</label><input id="photos" type="file" accept="image/*" multiple><div id="previews" class="photos" style="margin-top:8px"></div><div class="checks"><input id="offers" type="checkbox"><label for="offers" style="margin:0">Aceito propostas</label></div><button id="save" class="primary" style="width:100%;margin-top:16px" type="submit">Publicar anúncio</button><div id="msg" class="msg"></div></form><div id="done" class="ok hidden"><strong>Anúncio publicado.</strong> Sua raquete já pode aparecer na vitrine.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://jaclntjjlzoumzkoiqgv.supabase.co',KEY='sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x',API=URL+'/functions/v1/raquetesto-access',sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let files=[];const num=v=>v===''?null:Number(String(v).replace(',','.'));async function call(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.json()}async function brands(){const {data}=await sb.from('raquetesto_brands').select('id,name').eq('active',true).order('name');$('brand').innerHTML='<option value="">Selecione</option>'+data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')+'<option value="other">Outra marca</option>'}function requireSession(){if(!localStorage.getItem('rt_session'))location.href='raquetesto-acesso.html'}$('brand').onchange=()=>$('brandOther').classList.toggle('hidden',$('brand').value!=='other');$('thickness').onchange=()=>$('thicknessOther').classList.toggle('hidden',$('thickness').value!=='other');$('photos').onchange=e=>{files=[...e.target.files].slice(0,4);$('previews').innerHTML=files.map(f=>`<div class="preview"><img src="${URL.createObjectURL(f)}"></div>`).join('')};async function resize(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,m=Math.max(w,h);if(m>1200){const k=1200/m;w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?resolve(b):reject(), 'image/webp',.82)};img.onerror=reject;img.src=u})}async function b64(blob){const a=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';$('save').disabled=true;$('save').textContent='Publicando...';const brand=$('brand').value,neg=$('negotiation').value;const x=await call({action:'create_listing',session:localStorage.getItem('rt_session'),brand_id:brand&&brand!=='other'?brand:null,brand_other:brand==='other'?$('brandOther').value:'',model:$('model').value,model_year:$('year').value,item_condition:$('condition').value,negotiation_type:neg,price:neg==='troca'?null:num($('price').value),weight_g:num($('weight').value),balance_cm:num($('balance').value),thickness_mm:$('thickness').value==='other'?num($('thicknessOther').value):num($('thickness').value),face_material:$('material').value,city:$('city').value,state:$('state').value,description:$('description').value,accepts_offers:$('offers').checked,included_accessories:$('accessories').value});if(x.error){$('msg').textContent=x.error;$('save').disabled=false;$('save').textContent='Publicar anúncio';return}for(let i=0;i<files.length;i++){const blob=await resize(files[i]);if(blob.size>1572864){$('msg').textContent='A foto '+(i+1)+' ficou grande demais.';continue}const up=await call({action:'upload_photo',session:localStorage.getItem('rt_session'),id:x.id,position:i+1,mime:'image/webp',base64:await b64(blob)});if(up.error)$('msg').textContent='Anúncio salvo, mas uma foto não foi enviada: '+up.error}$('form').classList.add('hidden');$('done').classList.remove('hidden');setTimeout(()=>location.href='raquetesto-acesso.html',1200)};requireSession();brands();</script></body></html>
