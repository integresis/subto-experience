<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Encontre. Anuncie. Jogue.</title><style>:root{--n:#0d1321;--l:#a6e22e;--bg:#f5f6f8;--m:#667085;--line:#e5e7eb;--green:#25d366}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--n)}header{background:var(--n);color:#fff;padding:8px 16px;position:sticky;top:0;z-index:3}.head,main,footer{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.brand-logo{display:block;width:260px;max-width:62vw;height:70px;object-fit:contain;object-position:left center}.btn,button{border:0;border-radius:11px;padding:11px 13px;font-weight:800;cursor:pointer;text-decoration:none}.announce,.primary{background:var(--l);color:var(--n)}main{padding:22px 14px 60px}.hero h1{font-size:clamp(27px,6vw,46px);margin:0 0 8px}.hero p{color:var(--m)}.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:8px;margin-bottom:18px}.filters input,.filters select,.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;font-size:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;cursor:pointer}.photo{aspect-ratio:1;background:#eceff3;display:grid;place-items:center;overflow:hidden;color:#98a2b3}.photo img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:9px;left:9px;background:#fff4cc;color:#7a4d00;padding:6px 8px;border-radius:999px;font-size:10px;font-weight:900}.body{padding:12px}.brandname{font-size:12px;color:var(--m);text-transform:uppercase;font-weight:800}.model{font-weight:900;margin:4px 0}.price{font-size:20px;font-weight:900;margin:8px 0}.specs{display:flex;gap:5px;flex-wrap:wrap}.pill{font-size:11px;background:#f2f4f7;border-radius:999px;padding:5px 7px}.city,.seller{font-size:12px;color:var(--m);margin-top:8px}.empty{grid-column:1/-1;background:#fff;padding:40px;text-align:center;border-radius:16px}.modalbg{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}.modalbg.on{display:flex}.modal{background:#fff;width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right;background:#eef1f4}.detailphoto{width:100%;max-height:380px;object-fit:contain;background:#f2f4f7;border-radius:14px}.whatsapp{display:block;background:var(--green);color:#062b16;text-align:center;width:100%;margin:14px 0}.wait{display:block;background:#eef1f4;color:var(--n);width:100%;margin:14px 0}.exp{border-top:1px solid var(--line);padding:12px 0}.ratings{font-size:12px;color:var(--m)}label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px}footer{padding:0 14px 35px;color:var(--m);font-size:12px;line-height:1.5}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:700px){.modalbg{align-items:center}.modal{border-radius:20px}}@media(max-width:420px){header{padding:7px 12px}.brand-logo{width:205px;height:60px}.announce{padding:10px 11px}.grid{gap:9px}.body{padding:9px}.price{font-size:17px}}</style></head><body><header><div class="head"><a href="raquetesto.html"><img class="brand-logo" src="assets/raquetesto-logo.svg" alt="RaquetesTO — Encontre. Anuncie. Jogue."></a><a class="btn announce" href="raquetesto-acesso.html">+ Anunciar</a></div></header><main><section class="hero"><h1>Encontre. Anuncie. Jogue.</h1><p>Raquetes de Beach Tennis da nossa comunidade em um só lugar.</p></section><section class="filters"><input id="q" placeholder="Buscar modelo"><select id="brand"><option value="">Todas as marcas</option></select><select id="condition"><option value="">Nova ou usada</option><option value="nova">Nova</option><option value="usada">Usada</option></select><select id="sort"><option value="recent">Mais recentes</option><option value="price_asc">Menor preço</option><option value="price_desc">Maior preço</option></select></section><p id="count"></p><section id="grid" class="grid"><div class="empty">Carregando raquetes…</div></section></main><footer><strong>RaquetesTO é uma vitrine comunitária.</strong> Não intermediamos pagamentos, negociações, entregas ou garantias. Confira o produto e combine tudo diretamente com o anunciante.</footer><div id="modalbg" class="modalbg" onclick="if(event.target===this)closeDetail()"><div id="modal" class="modal"></div></div><script>const API='https://jaclntjjlzoumzkoiqgv.supabase.co/functions/v1/raquetesto-public',PUBLIC='https://jaclntjjlzoumzkoiqgv.supabase.co/storage/v1/object/public/raquetesto-photos/',$=id=>document.getElementById(id);let all=[],current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>v==null?'Troca':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function call(body){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return await r.json()}catch{return{error:'Não foi possível conectar.'}}}async function init(){const [b,l]=await Promise.all([call({action:'brands'}),call({action:'listings'})]);if(b.data)$('brand').innerHTML='<option value="">Todas as marcas</option>'+b.data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(l.data){all=l.data;render()}else $('grid').innerHTML='<div class="empty">Não foi possível carregar os anúncios.</div>'}function render(){let d=[...all],q=$('q').value.toLowerCase(),br=$('brand').value,c=$('condition').value;if(q)d=d.filter(x=>(x.model+' '+(x.raquetesto_brands?.name||'')).toLowerCase().includes(q));if(br)d=d.filter(x=>x.brand_id===br);if(c)d=d.filter(x=>x.item_condition===c);if($('sort').value==='price_asc')d.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));if($('sort').value==='price_desc')d.sort((a,b)=>(b.price??-1)-(a.price??-1));$('count').textContent=d.length+' anúncio(s)';$('grid').innerHTML=d.slice(0,20).map(x=>{const p=(x.raquetesto_listing_photos||[]).sort((a,b)=>a.position-b.position)[0];return `<article class="card" onclick="openDetail('${x.id}')">${x.status==='negotiating'?'<span class="badge">EM NEGOCIAÇÃO</span>':''}<div class="photo">${p?`<img loading="lazy" src="${PUBLIC+p.storage_path}">`:'Sem foto'}</div><div class="body"><div class="brandname">${esc(x.raquetesto_brands?.name||x.brand_other||'')}</div><div class="model">${esc(x.model)}</div><div class="price">${money(x.price)}</div><div class="specs"><span class="pill">${esc(x.item_condition)}</span><span class="pill">${x.weight_g} g</span></div><div class="seller">Anunciado por ${esc(x.raquetesto_users?.name?.split(' ')[0]||'membro da comunidade')}</div><div class="city">${esc(x.city)} · ${esc(x.state)}</div></div></article>`}).join('')||'<div class="empty">Nenhuma raquete encontrada.</div>'}async function openDetail(id){current=all.find(x=>x.id===id);if(!current)return;const x=current,p=(x.raquetesto_listing_photos||[]).sort((a,b)=>a.position-b.position)[0],seller=x.raquetesto_users?.name||'Anunciante';$('modal').innerHTML=`<button class="close" onclick="closeDetail()">✕</button>${p?`<img class="detailphoto" src="${PUBLIC+p.storage_path}">`:''}<h2>${esc(x.raquetesto_brands?.name||x.brand_other||'')} ${esc(x.model)}</h2><div class="price">${money(x.price)}</div><p>${esc(x.description||'')}</p><div class="specs"><span class="pill">${x.weight_g} g</span>${x.balance_cm?`<span class="pill">${x.balance_cm} cm</span>`:''}${x.thickness_mm?`<span class="pill">${x.thickness_mm} mm</span>`:''}${x.face_material?`<span class="pill">${esc(x.face_material)}</span>`:''}</div><p><strong>Anunciado por ${esc(seller)}</strong><br><small>${esc(x.city)}/${esc(x.state)}</small></p>${x.status==='negotiating'?`<div class="badge" style="position:static;display:inline-block">EM NEGOCIAÇÃO</div><button class="wait" onclick="waitForm()">Quero ser avisado se ficar disponível</button>`:`<button class="whatsapp" onclick="interest()">Tenho interesse · Falar no WhatsApp</button>`}<section><h3>Experiências com esta raquete</h3><div id="experiences">Carregando…</div><button class="wait" onclick="experienceForm()">Já jogou com esta raquete? Conte sua experiência</button><div id="form"></div></section>`;$('modalbg').classList.add('on');document.body.style.overflow='hidden';loadExp()}function closeDetail(){$('modalbg').classList.remove('on');document.body.style.overflow=''}async function interest(){await call({action:'interest',listing_id:current.id,kind:'interest'});const phone=(current.raquetesto_users?.whatsapp||'').replace(/\D/g,'');if(!phone)return alert('O anunciante ainda não informou um WhatsApp.');const full=phone.startsWith('55')?phone:'55'+phone,msg=`Olá, ${current.raquetesto_users?.name?.split(' ')[0]||''}! Vi sua ${current.raquetesto_brands?.name||current.brand_other||''} ${current.model} no RaquetesTO e tenho interesse. Ela ainda está disponível?`;location.href=`https://wa.me/${full}?text=${encodeURIComponent(msg)}`}function waitForm(){$('form').innerHTML=`<div><label>Seu nome</label><input id="wn"><label>WhatsApp</label><input id="ww" placeholder="(63) 99999-9999"><label>E-mail (opcional)</label><input id="we" type="email"><button class="primary" style="width:100%;margin-top:10px" onclick="saveWait()">Quero ser avisado</button></div>`}async function saveWait(){const x=await call({action:'interest',listing_id:current.id,kind:'waitlist',name:$('wn').value,whatsapp:$('ww').value,email:$('we').value});alert(x.error||'Pronto. Seu interesse ficou registrado.');if(!x.error)$('form').innerHTML=''}async function loadExp(){const x=await call({action:'experiences',brand_id:current.brand_id,model:current.model});$('experiences').innerHTML=x.data?.length?x.data.map(e=>`<div class="exp"><strong>${esc(e.guest_name||e.raquetesto_users?.name||'Membro')}</strong>${e.player_level?` · ${esc(e.player_level)}`:''}<div class="ratings">Potência ${e.power_rating||'-'}/5 · Controle ${e.control_rating||'-'}/5 · Conforto ${e.comfort_rating||'-'}/5</div><p>${esc(e.comment)}</p></div>`).join(''):'<p>Ainda não há experiências publicadas para este modelo.</p>'}function experienceForm(){$('form').innerHTML=`<label>Seu nome</label><input id="en"><label>Seu nível</label><select id="el"><option value="">Selecione</option><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select><label>Quanto tempo usou/testou?</label><input id="eu"><label>Potência (1 a 5)</label><select id="ep">${opts()}</select><label>Controle (1 a 5)</label><select id="ec">${opts()}</select><label>Conforto (1 a 5)</label><select id="eo">${opts()}</select><label>Conte sua experiência</label><textarea id="et" rows="4" maxlength="1000"></textarea><button class="primary" style="width:100%;margin-top:10px" onclick="saveExp()">Enviar experiência</button><p><small>A experiência será publicada após uma conferência rápida.</small></p>`}function opts(){return '<option value="">-</option>'+[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}async function saveExp(){const x=await call({action:'add_experience',listing_id:current.id,name:$('en').value,player_level:$('el').value,usage_period:$('eu').value,power_rating:$('ep').value,control_rating:$('ec').value,comfort_rating:$('eo').value,comment:$('et').value});alert(x.error||x.message);if(!x.error)$('form').innerHTML=''}['brand','condition','sort'].forEach(id=>$(id).addEventListener('change',render));$('q').addEventListener('input',render);init();</script></body></html>
