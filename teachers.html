<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo Experience — Professores</title><style>
:root{--navy:#082657;--orange:#f28a00;--bg:#f5f7fa;--ink:#1f2f49;--muted:#6b7587;--line:#dde4ed;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),#104488);color:#fff;padding:20px 16px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:25px;font-weight:900}.brand b{color:var(--orange)}header p{margin:4px 0 0;opacity:.85}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,a.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--orange);color:#fff}.secondary{background:#eaf0f7;color:var(--navy)}.danger{background:#fff0ee;color:var(--danger)}.hidden{display:none!important}main{padding:20px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.field span{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#485a72}input,select{width:100%;border:1px solid #cfd8e5;border-radius:10px;padding:11px 12px;font:inherit;background:#fff}.photo{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:64px 1.3fr 1fr 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.thumb{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eef2f6}.meta{font-size:13px;color:var(--muted)}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:var(--muted)}dialog{width:min(560px,94vw);border:0;border-radius:18px;padding:0;box-shadow:0 30px 80px #0003}dialog::backdrop{background:#06162f99}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.modalbody .grid{grid-template-columns:1fr}.note{font-size:12px;color:var(--muted);margin-top:7px}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:56px 1fr}.row>div:nth-child(3),.row>div:nth-child(4){grid-column:2}.rowactions{grid-column:1/-1}.top{align-items:flex-start}}
</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><p>Módulo · Professores</p></div><div class="nav"><a class="btn secondary" href="./admin.html">Atletas</a><button id="logout" class="btn secondary hidden">Sair</button></div></div></header><main class="wrap">
<section id="blocked" class="card hidden"><strong>Acesso restrito.</strong><p>Entre primeiro pelo painel administrativo.</p></section>
<section id="app" class="hidden"><div class="card"><h2 style="margin-top:0">Novo professor</h2><form id="createForm"><div class="grid"><label class="field"><span>Nome completo</span><input name="name" required></label><label class="field"><span>WhatsApp</span><input id="phone" name="whatsapp" inputmode="numeric" maxlength="16" required></label><label class="field"><span>Arena/Clube</span><select id="club" name="club_name" required><option>AABB</option><option>Bortolott</option><option>Orla</option><option>Saulo</option><option>SESI</option><option>TO na Areia</option><option>Tody</option><option>Outro</option></select></label><label id="clubOtherWrap" class="field hidden"><span>Outra arena/clube</span><input name="club_other"></label><label class="field photo"><span>Foto (opcional)</span><input id="photo" name="photo" type="file" accept="image/*"></label></div><div class="actions"><button class="btn primary" type="submit">Cadastrar professor</button></div><div id="msg" class="note"></div></form></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Professores cadastrados</h2><input id="search" placeholder="Buscar por nome ou arena" style="max-width:320px"></div></div><div id="list" class="list"></div></section></main>
<dialog id="editDialog"><div class="modalhead"><strong>Editar professor</strong><button class="btn secondary" onclick="editDialog.close()">Cancelar</button></div><form id="editForm" class="modalbody"><input type="hidden" name="id"><div class="grid"><label class="field"><span>Nome completo</span><input name="name" required></label><label class="field"><span>WhatsApp</span><input id="editPhone" name="whatsapp" inputmode="numeric" maxlength="16" required></label><label class="field"><span>Arena/Clube</span><select id="editClub" name="club_name"><option>AABB</option><option>Bortolott</option><option>Orla</option><option>Saulo</option><option>SESI</option><option>TO na Areia</option><option>Tody</option><option>Outro</option></select></label><label id="editClubOtherWrap" class="field hidden"><span>Outra arena/clube</span><input name="club_other"></label><label class="field"><span>Nova foto (opcional)</span><input id="editPhoto" name="photo" type="file" accept="image/*"></label></div><div class="actions"><button class="btn primary" type="submit">Salvar alterações</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let rows=[];const app=document.getElementById('app'),blocked=document.getElementById('blocked'),list=document.getElementById('list'),createForm=document.getElementById('createForm'),editForm=document.getElementById('editForm'),club=document.getElementById('club'),editClub=document.getElementById('editClub');const digits=v=>String(v||'').replace(/\D/g,'');function phoneMask(v){const d=digits(v).slice(0,11);if(d.length<=2)return d?`(${d}`:'';if(d.length<=3)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=7)return`(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3)}`;return`(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function arena(r){return r.club_name==='Outro'?(r.club_other||'Outro'):(r.club_name||'')};document.getElementById('phone').oninput=e=>e.target.value=phoneMask(e.target.value);document.getElementById('editPhone').oninput=e=>e.target.value=phoneMask(e.target.value);club.onchange=()=>document.getElementById('clubOtherWrap').classList.toggle('hidden',club.value!=='Outro');editClub.onchange=()=>document.getElementById('editClubOtherWrap').classList.toggle('hidden',editClub.value!=='Outro');
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){blocked.classList.remove('hidden');return}const {data:ok}=await sb.rpc('is_admin');if(!ok){blocked.classList.remove('hidden');return}app.classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');load()}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./admin.html'};
async function uploadPhoto(file,id){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${id}/${Date.now()}.${ext}`;const {error}=await sb.storage.from('teacher-photos').upload(path,file,{upsert:false});if(error)throw error;return path}
async function signed(path){if(!path)return'';const {data}=await sb.storage.from('teacher-photos').createSignedUrl(path,3600);return data?.signedUrl||''}
createForm.onsubmit=async e=>{e.preventDefault();const fd=new FormData(createForm),id=crypto.randomUUID();const msg=document.getElementById('msg');msg.textContent='Salvando...';try{const photoPath=await uploadPhoto(fd.get('photo')?.size?fd.get('photo'):null,id);const payload={id,name:fd.get('name').trim(),whatsapp:digits(fd.get('whatsapp')),club_name:fd.get('club_name'),club_other:fd.get('club_name')==='Outro'?(fd.get('club_other')||null):null,photo_path:photoPath};const {error}=await sb.from('teachers').insert(payload);if(error)throw error;createForm.reset();club.value='AABB';document.getElementById('clubOtherWrap').classList.add('hidden');msg.textContent='Professor cadastrado.';load()}catch(err){msg.textContent='Erro: '+(err.message||err)}};
async function load(){const {data,error}=await sb.from('teachers').select('*').order('name');if(error){list.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}
async function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filtered=rows.filter(r=>!q||`${r.name} ${arena(r)}`.toLowerCase().includes(q));if(!filtered.length){list.innerHTML='<div class="empty">Nenhum professor cadastrado.</div>';return}list.innerHTML='';for(const r of filtered){const p=await signed(r.photo_path);list.insertAdjacentHTML('beforeend',`<div class="row">${p?`<img class="thumb" src="${p}">`:'<div class="thumb"></div>'}<div><strong>${esc(r.name)}</strong><div class="meta">${esc(phoneMask(r.whatsapp))}</div></div><div><strong>Arena</strong><div class="meta">${esc(arena(r))}</div></div><div><strong>Foto</strong><div class="meta">${r.photo_path?'Sim':'Não'}</div></div><div class="rowactions"><button class="btn secondary" data-a="edit" data-id="${r.id}">Editar</button><button class="btn danger" data-a="del" data-id="${r.id}">Excluir</button></div></div>`)} }
document.getElementById('search').oninput=render;list.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const r=rows.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.a==='edit')showEdit(r);else remove(r)};function setVal(n,v){const el=editForm.elements[n];if(el)el.value=v??''}function showEdit(r){setVal('id',r.id);setVal('name',r.name);setVal('whatsapp',phoneMask(r.whatsapp));setVal('club_name',r.club_name);setVal('club_other',r.club_other);document.getElementById('editClubOtherWrap').classList.toggle('hidden',r.club_name!=='Outro');editDialog.showModal()}
editForm.onsubmit=async e=>{e.preventDefault();const fd=new FormData(editForm),id=fd.get('id'),current=rows.find(x=>x.id===id);try{let photoPath=current?.photo_path||null;const f=fd.get('photo');if(f&&f.size)photoPath=await uploadPhoto(f,id);const payload={name:fd.get('name').trim(),whatsapp:digits(fd.get('whatsapp')),club_name:fd.get('club_name'),club_other:fd.get('club_name')==='Outro'?(fd.get('club_other')||null):null,photo_path:photoPath,updated_at:new Date().toISOString()};const {error}=await sb.from('teachers').update(payload).eq('id',id);if(error)throw error;editDialog.close();load()}catch(err){alert(err.message||err)}};
async function remove(r){const typed=prompt(`Para excluir ${r.name}, digite exatamente o nome do professor:`);if(typed===null)return;if(typed.trim()!==String(r.name||'').trim())return alert('Exclusão cancelada. O nome digitado não confere.');if(!confirm(`Última confirmação: excluir o cadastro de ${r.name}? O histórico anterior ficará registrado na auditoria.`))return;const {error}=await sb.from('teachers').delete().eq('id',r.id);if(error)alert(error.message);else load()};check();
</script></body></html>
