<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Eventos</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1f2f49}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:18px 14px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.full{grid-column:1/-1}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.danger{background:#fff0ee;color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.event{border-left:5px solid var(--o)}.event h3{margin:0;color:var(--n)}.muted{font-size:13px;color:var(--muted)}.hidden{display:none!important}dialog{width:min(900px,96vw);max-height:92vh;border:0;border-radius:17px;padding:0}dialog::backdrop{background:#06162f99}.head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}.body{padding:16px;max-height:78vh;overflow:auto}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin:12px 0}.athletes{display:grid;gap:7px}.athlete{display:grid;grid-template-columns:30px 46px 1.5fr .7fr 1fr;gap:8px;align-items:center;border:1px solid #e5eaf0;border-radius:10px;padding:9px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eef2f6;display:flex;align-items:center;justify-content:center;color:#8b98aa;font-size:18px;font-weight:800;flex:0 0 42px}.participants{margin-top:16px}.prow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf1f5;padding:9px 3px;align-items:center}.pinfo{display:flex;gap:10px;align-items:center}.pill{font-size:12px;background:#edf5ff;padding:4px 7px;border-radius:999px}@media(max-width:700px){.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.athlete{grid-template-columns:28px 46px 1fr}.athlete span:nth-child(4),.athlete span:nth-child(5){grid-column:3}.top{align-items:flex-start}.prow{align-items:flex-start}}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><div>Eventos</div></div><a class="btn secondary" href="./modules.html" style="text-decoration:none">Módulos</a></div></header><main class="wrap"><section id="blocked" class="card hidden">Acesso restrito. Entre primeiro pelo painel administrativo.</section><section id="app" class="hidden"><div class="card"><h2>Novo evento</h2><form id="eventForm"><div class="grid"><label><span>Nome / descrição</span><input name="name" required></label><label><span>Data</span><input name="start_date" type="date" required></label><label><span>Data final (opcional)</span><input name="end_date" type="date"></label><label><span>Local / Arena</span><input name="location"></label><label><span>Valor (R$)</span><input name="price" type="number" step="0.01" min="0"></label><label><span>Carga horária</span><input name="workload_hours" type="number" step="0.5" min="0"></label><label><span>Máximo de participantes</span><input name="max_participants" type="number" min="1"></label><label><span>Status</span><select name="status"><option>Planejamento</option><option>Inscrições abertas</option><option>Encerrado</option><option>Cancelado</option></select></label><label class="full"><span>Observações gerais</span><textarea name="notes" rows="3"></textarea></label></div><button class="btn primary" type="submit">Cadastrar evento</button></form></div><div id="events"></div></section></main><dialog id="peopleDialog"><div class="head"><strong id="dialogTitle">Participantes</strong><button class="btn secondary" onclick="peopleDialog.close()">Fechar</button></div><div class="body"><h3>Adicionar atletas</h3><div class="filters"><input id="q" placeholder="Pesquisar atleta"><select id="fcat"><option value="">Todas as categorias</option><option>Sub-12</option><option>Sub-14</option><option>Sub-16</option><option>Sub-18</option></select><select id="farena"><option value="">Todas as arenas</option></select></div><div class="actions"><button id="selectVisible" class="btn secondary">Marcar visíveis</button><button id="clearSelection" class="btn secondary">Desmarcar</button><button id="addSelected" class="btn primary">Adicionar selecionados</button></div><div id="athletes" class="athletes"></div><div class="participants"><h3>Já incluídos</h3><div id="participants"></div></div></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let eventRows=[],athleteRows=[],participantRows=[],currentEvent=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const arena=r=>r.club_name==='Outro'?(r.club_other||'Outro'):(r.club_name||'');async function signPhoto(path){if(!path)return'';const {data}=await sb.storage.from('athlete-photos').createSignedUrl(path,3600);return data?.signedUrl||''}function avatar(url,name){return url?`<img class="avatar" src="${esc(url)}" alt="">`:`<div class="avatar">${esc((name||'?').trim().charAt(0).toUpperCase())}</div>`}async function check(){const {data:{session}}=await sb.auth.getSession();if(!session)return blocked.classList.remove('hidden');const {data:ok}=await sb.rpc('is_admin');if(!ok)return blocked.classList.remove('hidden');app.classList.remove('hidden');await load()}async function load(){const [e,a]=await Promise.all([sb.from('events').select('*').order('start_date',{ascending:false}),sb.from('athlete_submissions').select('id,athlete_name,category,club_name,club_other,photo_path').order('athlete_name')]);if(e.error)return alert(e.error.message);if(a.error)return alert(a.error.message);eventRows=e.data||[];athleteRows=a.data||[];await Promise.all(athleteRows.map(async r=>r.photo_url=await signPhoto(r.photo_path)));renderEvents();const as=[...new Set(athleteRows.map(arena).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'pt-BR'));farena.innerHTML='<option value="">Todas as arenas</option>'+as.map(x=>`<option>${esc(x)}</option>`).join('')}eventForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(eventForm),payload={name:f.get('name').trim(),start_date:f.get('start_date'),end_date:f.get('end_date')||null,location:f.get('location')||null,price:f.get('price')||null,workload_hours:f.get('workload_hours')||null,max_participants:f.get('max_participants')||null,status:f.get('status'),notes:f.get('notes')||null};const {error}=await sb.from('events').insert(payload);if(error)return alert(error.message);eventForm.reset();load()};function money(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function renderEvents(){events.innerHTML=eventRows.length?'':'<div class="card">Nenhum evento cadastrado.</div>';eventRows.forEach(r=>events.insertAdjacentHTML('beforeend',`<div class="card event"><h3>${esc(r.name)}</h3><div class="muted">${esc(r.start_date)}${r.end_date?' a '+esc(r.end_date):''} · ${esc(r.location||'Local não informado')} · ${money(r.price)} · ${esc(r.workload_hours||'—')}h · ${esc(r.status)}</div>${r.notes?`<p>${esc(r.notes)}</p>`:''}<div class="actions"><button class="btn primary" data-people="${r.id}">Participantes</button></div></div>`))}events.onclick=e=>{const b=e.target.closest('[data-people]');if(b)openPeople(eventRows.find(x=>x.id===b.dataset.people))};async function openPeople(ev){currentEvent=ev;dialogTitle.textContent='Participantes · '+ev.name;const {data,error}=await sb.from('event_participants').select('*').eq('event_id',ev.id);if(error)return alert(error.message);participantRows=data||[];q.value='';fcat.value='';farena.value='';renderAthletes();renderParticipants();peopleDialog.showModal()}function available(){const included=new Set(participantRows.filter(x=>x.athlete_id).map(x=>x.athlete_id)),qq=q.value.trim().toLowerCase();return athleteRows.filter(r=>!included.has(r.id)&&(!qq||r.athlete_name.toLowerCase().includes(qq))&&(!fcat.value||r.category===fcat.value)&&(!farena.value||arena(r)===farena.value))}function renderAthletes(){const a=available();athletes.innerHTML=a.length?'':'<div class="muted">Nenhum atleta encontrado.</div>';a.forEach(r=>athletes.insertAdjacentHTML('beforeend',`<label class="athlete"><input type="checkbox" data-athlete="${r.id}">${avatar(r.photo_url,r.athlete_name)}<strong>${esc(r.athlete_name)}</strong><span>${esc(r.category)}</span><span>${esc(arena(r))}</span></label>`))}function renderParticipants(){const ids=new Map(athleteRows.map(x=>[x.id,x]));const list=participantRows.filter(x=>x.athlete_id);participants.innerHTML=list.length?'':'<div class="muted">Nenhum participante incluído.</div>';list.forEach(p=>{const r=ids.get(p.athlete_id);if(!r)return;participants.insertAdjacentHTML('beforeend',`<div class="prow"><div class="pinfo">${avatar(r.photo_url,r.athlete_name)}<span><strong>${esc(r.athlete_name)}</strong> <span class="pill">${esc(r.category)}</span><br><span class="muted">${esc(arena(r))}</span></span></div><button class="btn danger" data-remove="${p.id}">Remover</button></div>`)})}[q,fcat,farena].forEach(x=>x.oninput=renderAthletes);selectVisible.onclick=()=>athletes.querySelectorAll('[data-athlete]').forEach(x=>x.checked=true);clearSelection.onclick=()=>athletes.querySelectorAll('[data-athlete]').forEach(x=>x.checked=false);addSelected.onclick=async()=>{const ids=[...athletes.querySelectorAll('[data-athlete]:checked')].map(x=>x.dataset.athlete);if(!ids.length)return alert('Selecione pelo menos um atleta.');const payload=ids.map(id=>({event_id:currentEvent.id,participant_type:'athlete',athlete_id:id,charged_amount:currentEvent.price}));const {error}=await sb.from('event_participants').insert(payload);if(error)return alert(error.message);openPeople(currentEvent)};participants.onclick=async e=>{const b=e.target.closest('[data-remove]');if(!b)return;if(!confirm('Remover este participante do evento? O cadastro do atleta não será excluído.'))return;const {error}=await sb.from('event_participants').delete().eq('id',b.dataset.remove);if(error)return alert(error.message);openPeople(currentEvent)};check();</script></body></html>
