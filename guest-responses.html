<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Perguntas das Famílias</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f4f7fb;--line:#dbe3ed;--muted:#68758a;--green:#177245}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:22px 15px}.wrap{max-width:760px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.athlete{font-size:19px;font-weight:900;color:var(--n)}.muted{font-size:12px;color:var(--muted)}.q{background:#f7f9fc;border-radius:10px;padding:11px;margin:10px 0;line-height:1.4}.q b{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}textarea{width:100%;min-height:120px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer;background:var(--o);color:#fff}.saved{color:var(--green);font-size:12px;font-weight:800;margin-left:8px}.empty{text-align:center;padding:35px 15px}.hidden{display:none!important}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div id="head">Perguntas das Famílias</div></div></header><main class="wrap"><div id="loading" class="card empty">Abrindo suas perguntas...</div><div id="invalid" class="card empty hidden"><b>Este link não está disponível.</b><div class="muted" style="margin-top:6px">Solicite um novo link ao responsável pelo evento.</div></div><div id="intro" class="card hidden"><b id="eventName"></b><div id="guestName" class="muted"></div><p style="margin-bottom:0">Responda somente o que considerar necessário. Você pode voltar a este link enquanto ele estiver ativo.</p></div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const token=new URLSearchParams(location.search).get('t');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function q(label,text){return text?`<div class="q"><b>${label}</b>${esc(text)}</div>`:''}async function save(id){const el=document.getElementById('r-'+id),st=document.getElementById('s-'+id);st.textContent='Salvando...';const{error}=await sb.rpc('save_guest_guardian_response',{p_token:token,p_evaluation_id:id,p_response:el.value});st.textContent=error?'Erro ao salvar':'Salvo ✓';if(error)alert(error.message);else setTimeout(()=>st.textContent='',1800)}window.save=save;async function init(){if(!token){loading.classList.add('hidden');return invalid.classList.remove('hidden')}const{data,error}=await sb.rpc('get_guest_evaluation_questions',{p_token:token});loading.classList.add('hidden');if(error||!data?.length)return invalid.classList.remove('hidden');intro.classList.remove('hidden');eventName.textContent=data[0].event_name||'Evento';guestName.textContent=data[0].guest_name?`Convidado: ${data[0].guest_name}`:'';list.innerHTML=data.map(x=>`<section class="card"><div class="athlete">${esc(x.athlete_name)}</div><div class="muted">${esc(x.category||'')}</div>${q('Pergunta 1',x.question_one)}${q('Pergunta 2',x.question_two)}${q('Observação da família',x.family_note)}<label class="muted"><b>Sua resposta</b></label><textarea id="r-${x.evaluation_id}" placeholder="Responda de forma simples para a família...">${esc(x.guardian_response||'')}</textarea><div style="margin-top:9px"><button class="btn" onclick="save('${x.evaluation_id}')">Salvar resposta</button><span id="s-${x.evaluation_id}" class="saved"></span></div></section>`).join('')}init();</script></body></html>
