<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Avaliação do Instrutor</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f4f7fb;--line:#dbe3ed;--muted:#68758a;--green:#177245;--red:#a33a3a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:22px 15px}.wrap{max-width:820px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.muted{font-size:12px;color:var(--muted)}.hidden{display:none!important}.empty{text-align:center;padding:35px 15px}.error{color:var(--red)}h2,h3{color:var(--n)}.moments{display:grid;gap:10px}.moment{border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;background:#fff}.moment:hover{border-color:#afbdd0}.moment-top{display:flex;justify-content:space-between;gap:10px}.progress{font-weight:900;color:var(--n)}.bar{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--o)}.athlete-strip{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.athlete-chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 10px;white-space:nowrap;font-weight:800;color:var(--n);cursor:pointer}.athlete-chip.done{background:#edf9f2;border-color:#bfe3ce;color:var(--green)}.athlete-chip.current{outline:2px solid var(--o)}.athlete-head{display:flex;gap:14px;align-items:center}.athlete-photo{width:104px;height:104px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:#edf1f6;flex:0 0 104px}.athlete{font-size:22px;font-weight:900;color:var(--n)}.q{background:#f7f9fc;border-radius:10px;padding:11px;margin:10px 0;line-height:1.4}.q b{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}textarea{width:100%;min-height:110px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;resize:vertical}.label{display:block;font-size:12px;font-weight:900;color:var(--n);margin:13px 0 5px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.actions,.nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.nav{justify-content:space-between;margin-top:12px}.saved{color:var(--green);font-size:12px;font-weight:800}.back{margin-bottom:12px}@media(max-width:600px){.moment-top{display:block}.nav .btn{flex:1}.athlete{font-size:20px}.athlete-photo{width:92px;height:92px;flex-basis:92px}}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div id="head">Avaliação do Instrutor</div></div></header><main class="wrap"><div id="loading" class="card empty">Abrindo o evento...</div><div id="invalid" class="card empty error hidden"><b>Este link não está disponível.</b><div class="muted" style="margin-top:6px">Solicite um novo link ao responsável pelo evento.</div></div><section id="home" class="hidden"><div class="card"><b id="eventName"></b><div id="guestName" class="muted"></div><p style="margin-bottom:0">Escolha uma turma. Você poderá acompanhar facilmente quem já foi avaliado.</p></div><div id="moments" class="moments"></div></section><section id="evaluation" class="hidden"><button id="back" class="btn secondary back">← Voltar às turmas</button><div class="card"><div id="momentTitle" style="font-weight:900;color:var(--n)"></div><div id="momentProgress" class="muted"></div><div id="athleteStrip" class="athlete-strip"></div></div><div class="card"><div class="athlete-head"><img id="athletePhoto" class="athlete-photo hidden" alt="Foto do atleta"><div><div id="athleteName" class="athlete"></div><div id="athleteMeta" class="muted"></div><div id="position" class="muted" style="margin-top:3px"></div></div></div></div><div class="card"><h3 style="margin-top:0">Informações da família</h3><div id="questions"></div></div><div class="card"><label class="label">Resposta aos responsáveis</label><textarea id="guardianResponse" placeholder="Digite uma resposta/devolutiva para a família..."></textarea><label class="label">Observação técnica do instrutor</label><textarea id="technicalText" placeholder="Opcional. Registre aqui uma consideração técnica sobre o atleta..."></textarea><div class="actions" style="margin-top:10px"><button id="save" class="btn primary">Salvar avaliação</button><span id="saved" class="saved"></span></div></div><div class="nav"><button id="prev" class="btn secondary">← Anterior</button><button id="next" class="btn primary">Próximo →</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('t');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let momentRows=[],currentMoment=null,athletes=[],idx=0;const photoCache=new Map();function q(label,text){return text?`<div class="q"><b>${label}</b>${esc(text)}</div>`:''}function birthInfo(v){if(!v)return'';const[y,m,d]=String(v).slice(0,10).split('-').map(Number),t=new Date();let age=t.getFullYear()-y;if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))age--;return `${age} anos · ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`}function fmtMoment(m){return [m.moment_name,m.activity_date?new Date(m.activity_date+'T12:00:00').toLocaleDateString('pt-BR'):'',m.start_time?String(m.start_time).slice(0,5):'',m.location].filter(Boolean).join(' · ')}function renderMoments(){moments.innerHTML=momentRows.map(m=>{const pct=m.total_athletes?Math.round(Number(m.evaluated_athletes)*100/Number(m.total_athletes)):0;return `<div class="moment" onclick="openMoment('${m.moment_id}')"><div class="moment-top"><div><b>${esc(m.moment_name)}</b><div class="muted">${esc([m.activity_date?new Date(m.activity_date+'T12:00:00').toLocaleDateString('pt-BR'):'',m.start_time?String(m.start_time).slice(0,5):'',m.location].filter(Boolean).join(' · '))}</div></div><div class="progress">${m.evaluated_athletes} de ${m.total_athletes} avaliados</div></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="card empty">Nenhuma turma configurada para este evento.</div>'}window.openMoment=async id=>{currentMoment=momentRows.find(x=>x.moment_id===id);const r=await sb.rpc('get_guest_moment_athletes',{p_token:token,p_moment_id:id});if(r.error)return alert(r.error.message);athletes=r.data||[];if(!athletes.length)return alert('Esta turma ainda não possui atletas.');idx=0;home.classList.add('hidden');evaluation.classList.remove('hidden');showAthlete()};function renderStrip(){athleteStrip.innerHTML=athletes.map((a,i)=>`<button class="athlete-chip ${a.evaluated?'done':''} ${i===idx?'current':''}" onclick="go(${i})">${a.evaluated?'✓ ':''}${esc(a.athlete_name)}</button>`).join('')}window.go=i=>{idx=i;showAthlete()};async function loadPhoto(a){athletePhoto.classList.add('hidden');athletePhoto.removeAttribute('src');const athleteId=a.athlete_id;if(photoCache.has(athleteId)){const url=photoCache.get(athleteId);if(url&&athletes[idx]?.athlete_id===athleteId){athletePhoto.src=url;athletePhoto.classList.remove('hidden')}return}const{data,error}=await sb.functions.invoke('guest-athlete-photo',{body:{token,moment_id:currentMoment.moment_id,athlete_id:athleteId}});const url=!error&&data?.photo_url?data.photo_url:null;photoCache.set(athleteId,url);if(url&&athletes[idx]?.athlete_id===athleteId){athletePhoto.src=url;athletePhoto.classList.remove('hidden')}}function showAthlete(){const a=athletes[idx];momentTitle.textContent=fmtMoment(currentMoment);const done=athletes.filter(x=>x.evaluated).length;momentProgress.textContent=`${done} de ${athletes.length} avaliados`;athleteName.textContent=a.athlete_name;athleteMeta.textContent=[a.category,birthInfo(a.birth_date),a.club_name==='Outro'?a.club_other:a.club_name].filter(Boolean).join(' · ');position.textContent=`Atleta ${idx+1} de ${athletes.length}${a.evaluated?' · Avaliado ✓':''}`;questions.innerHTML=q('Pergunta 1',a.question_one)+q('Pergunta 2',a.question_two)+q('Observação da família',a.family_note)||'<div class="muted">A família não deixou perguntas ou observações.</div>';guardianResponse.value=a.guardian_response||'';technicalText.value='';saved.textContent='';prev.disabled=idx===0;next.disabled=idx===athletes.length-1;renderStrip();loadPhoto(a);window.scrollTo({top:0,behavior:'smooth'})}save.onclick=async()=>{const a=athletes[idx];save.disabled=true;saved.textContent='Salvando...';const r=await sb.rpc('save_guest_evaluation',{p_token:token,p_moment_id:currentMoment.moment_id,p_athlete_id:a.athlete_id,p_guardian_response:guardianResponse.value,p_technical_text:technicalText.value});save.disabled=false;if(r.error){saved.textContent='';return alert(r.error.message)}a.guardian_response=guardianResponse.value.trim();a.evaluation_id=r.data;a.evaluated=!!(a.guardian_response||technicalText.value.trim());technicalText.value='';saved.textContent='Salvo ✓';renderStrip();const m=momentRows.find(x=>x.moment_id===currentMoment.moment_id);m.evaluated_athletes=athletes.filter(x=>x.evaluated).length;setTimeout(()=>saved.textContent='',1800);showAthlete()};prev.onclick=()=>{if(idx>0){idx--;showAthlete()}};next.onclick=()=>{if(idx<athletes.length-1){idx++;showAthlete()}};back.onclick=async()=>{evaluation.classList.add('hidden');home.classList.remove('hidden');await loadMoments()};async function loadMoments(){const r=await sb.rpc('get_guest_event_moments',{p_token:token});if(r.error||!r.data?.length){loading.classList.add('hidden');home.classList.add('hidden');return invalid.classList.remove('hidden')}momentRows=r.data;loading.classList.add('hidden');invalid.classList.add('hidden');home.classList.remove('hidden');eventName.textContent=momentRows[0].event_name||'Evento';guestName.textContent=momentRows[0].guest_name?`Instrutor: ${momentRows[0].guest_name}`:'';renderMoments()}async function init(){if(!token){loading.classList.add('hidden');return invalid.classList.remove('hidden')}await loadMoments()}init();</script></body></html>
