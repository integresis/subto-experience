<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Certificados</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#69768a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto}.top,.actions{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b{color:var(--o)}main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input{width:100%;border:1px solid #cad5e2;border-radius:10px;padding:11px;font:inherit}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.list{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:12px}.person{display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #edf1f5}.person:last-child{border-bottom:0}.person input{width:20px;height:20px}.person label{flex:1}.person small{color:var(--muted)}.preview-wrap{overflow:auto;padding:8px;background:#e9edf3;border-radius:12px}.certificate{position:relative;width:1120px;height:792px;background:#fff;color:var(--n);overflow:hidden;border:3px solid var(--n);font-family:Arial,sans-serif;transform-origin:top left}.certificate:before{content:"";position:absolute;inset:10px;border:1px solid var(--o);pointer-events:none}.corner1,.corner2{position:absolute;width:190px;height:24px;background:var(--n)}.corner1{top:0;left:0}.corner2{bottom:0;right:0;background:var(--o)}.cert-inner{position:absolute;inset:42px 55px;text-align:center}.logo{font-size:34px;font-weight:900;letter-spacing:-2px}.logo .bt{color:var(--o)}.experience{font-size:12px;letter-spacing:6px;margin-top:-4px}.cert-title{font-family:Georgia,serif;font-size:52px;letter-spacing:4px;margin:20px 0 10px}.cert-title:after{content:"";display:block;width:250px;height:3px;background:var(--o);margin:10px auto}.cert-intro{font-size:17px}.cert-name{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:42px;margin:10px auto 7px;max-width:850px;border-bottom:2px solid var(--o);padding-bottom:7px}.cert-body{font-size:18px;line-height:1.55;max-width:850px;margin:12px auto}.cert-body strong{color:var(--o)}.info-row{display:flex;justify-content:center;gap:0;margin:20px auto 10px;max-width:760px}.info{flex:1;padding:5px 18px;border-right:1px solid var(--o);font-size:14px}.info:last-child{border-right:0}.info b{display:block;font-size:16px}.signature{margin:25px auto 0;width:310px;border-top:1px solid var(--n);padding-top:6px;font-weight:800}.signature small{display:block;font-weight:500;letter-spacing:2px;margin-top:3px}.footer{position:absolute;left:55px;right:55px;bottom:28px;display:flex;justify-content:space-between;font-size:12px;font-weight:800}.count{font-weight:800;color:var(--n)}@media(max-width:700px){.grid{grid-template-columns:1fr}.certificate{transform:scale(.54);margin-bottom:-360px}.top{align-items:flex-start}.toolbar .btn{flex:1}}@media print{body{background:#fff}header,.no-print{display:none!important}main{padding:0}.wrap{max-width:none}.print-area{display:block!important}.certificate{transform:none!important;margin:0!important;width:297mm;height:210mm;border-width:2px;page-break-after:always;break-after:page}.certificate:last-child{page-break-after:auto;break-after:auto}.cert-inner{inset:12mm 15mm}.preview-wrap{padding:0;background:#fff;overflow:visible}.card{border:0;padding:0;margin:0}.print-preview-single{display:none!important}}@page{size:A4 landscape;margin:0}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><div>Certificados</div></div><a href="./modules.html" class="btn secondary">Módulos</a></div></header><main class="wrap"><section class="no-print"><div class="card grid"><label><span>Evento</span><select id="eventSel"><option value="">Selecione</option></select></label><label><span>Modelo</span><select id="modelSel"><option value="classic">Modelo 1 — suBTo Experience</option></select></label><label><span>Tipo de participante</span><select id="typeSel"><option value="athlete">Atletas</option></select></label><label><span>Turma</span><select id="classSel"><option value="all">Todas as turmas</option></select></label></div><div class="card"><div class="toolbar"><input id="search" placeholder="Pesquisar participante..." style="flex:1;min-width:200px"><button id="allBtn" class="btn secondary">Selecionar todos</button><button id="noneBtn" class="btn secondary">Limpar seleção</button><span id="count" class="count">0 selecionados</span></div><div id="people" class="list" style="margin-top:12px"><div class="person muted">Selecione um evento.</div></div></div><div class="card"><div class="grid"><label><span>Carga horária</span><input id="hours" value="1 hora"></label><label><span>Responsável / assinatura</span><input id="signer" value="Túlio Pimenta"></label></div><div class="toolbar" style="margin-top:12px"><button id="previewBtn" class="btn secondary">Atualizar visualização</button><button id="printBtn" class="btn primary">Imprimir certificados selecionados</button></div></div><div class="card print-preview-single"><strong>Pré-visualização</strong><div class="muted" style="margin:4px 0 10px">O nome abaixo muda conforme a seleção. Na impressão será gerada uma página por participante.</div><div class="preview-wrap"><div id="singlePreview"></div></div></div></section><section id="printArea" class="print-area hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let eventData=null,people=[],moments=[],links=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function longDate(v){if(!v)return'29 de agosto de 2026';const[y,m,d]=String(v).slice(0,10).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}function cert(name){const date=longDate(eventData?.start_date),event=eventData?.name||'suBTo Experience',location=eventData?.location||'AABB Palmas';return `<article class="certificate"><div class="corner1"></div><div class="corner2"></div><div class="cert-inner"><div class="logo">su<span class="bt">BT</span>o</div><div class="experience">EXPERIENCE</div><div class="cert-title">CERTIFICADO</div><div class="cert-intro">Certificamos que</div><div class="cert-name">${esc(name||'Nome do(a) Atleta')}</div><div class="cert-body">participou do <strong>${esc(event)}</strong> com ${esc($('signer').value||'Túlio Pimenta')},<br>realizado no dia ${esc(date)}, na ${esc(location)},<br>participando de uma experiência de formação e desenvolvimento<br>voltada aos jovens atletas do Beach Tennis.</div><div class="info-row"><div class="info">DATA<b>${esc(date)}</b></div><div class="info">LOCAL<b>${esc(location)}</b><span>Palmas – TO</span></div><div class="info">CARGA HORÁRIA<b>${esc($('hours').value||'1 hora')}</b></div></div><div class="signature">${esc($('signer').value||'Túlio Pimenta')}<small>TREINADOR</small></div></div><div class="footer"><span>REALIZAÇÃO: AABB PALMAS - TO</span><span>suBTo EXPERIENCE</span></div></article>`}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const{data,error}=await sb.from('events').select('*').order('start_date',{ascending:false});if(error)return alert(error.message);$('eventSel').innerHTML='<option value="">Selecione</option>'+(data||[]).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');$('eventSel')._events=data||[];renderPreview()}$('eventSel').onchange=loadEvent;async function loadEvent(){const id=$('eventSel').value;eventData=($('eventSel')._events||[]).find(e=>e.id===id)||null;if(!id){people=[];renderPeople();return}const [p,m,a]=await Promise.all([sb.from('event_participants').select('id,athlete_id').eq('event_id',id),sb.from('event_moments').select('id,name,start_time').eq('event_id',id).order('activity_date').order('start_time'),sb.from('event_moment_athletes').select('moment_id,event_participant_id')]);if(p.error||m.error||a.error)return alert((p.error||m.error||a.error).message);moments=m.data||[];links=(a.data||[]).filter(x=>moments.some(mm=>mm.id===x.moment_id));const parts=p.data||[],ids=parts.map(x=>x.athlete_id).filter(Boolean);let athletes=[];if(ids.length){const r=await sb.from('athlete_submissions').select('id,athlete_name,category').in('id',ids).order('athlete_name');if(r.error)return alert(r.error.message);athletes=r.data||[]}people=parts.map(p=>{const x=athletes.find(a=>a.id===p.athlete_id);return x?{participant_id:p.id,id:x.id,name:x.athlete_name,category:x.category,selected:true}:null}).filter(Boolean);$('classSel').innerHTML='<option value="all">Todas as turmas</option>'+moments.map(m=>`<option value="${m.id}">${esc(m.name)} · ${String(m.start_time||'').slice(0,5)}</option>`).join('');renderPeople();renderPreview()}function visiblePeople(){const q=$('search').value.trim().toLowerCase(),cl=$('classSel').value;return people.filter(p=>(!q||p.name.toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q))&&(cl==='all'||links.some(l=>l.moment_id===cl&&l.event_participant_id===p.participant_id)))}function renderPeople(){const v=visiblePeople();$('people').innerHTML=v.length?v.map(p=>`<div class="person"><input type="checkbox" data-id="${p.id}" ${p.selected?'checked':''}><label><b>${esc(p.name)}</b><br><small>${esc(p.category||'Atleta')}</small></label></div>`).join(''):'<div class="person muted">Nenhum participante encontrado.</div>';updateCount()}function updateCount(){$('count').textContent=`${people.filter(p=>p.selected).length} selecionado${people.filter(p=>p.selected).length===1?'':'s'}`}$('people').onchange=e=>{if(e.target.matches('[data-id]')){const p=people.find(x=>x.id===e.target.dataset.id);if(p)p.selected=e.target.checked;updateCount();renderPreview()}};$('search').oninput=renderPeople;$('classSel').onchange=renderPeople;$('allBtn').onclick=()=>{visiblePeople().forEach(p=>p.selected=true);renderPeople();renderPreview()};$('noneBtn').onclick=()=>{people.forEach(p=>p.selected=false);renderPeople();renderPreview()};function renderPreview(){const p=people.find(x=>x.selected)||people[0];$('singlePreview').innerHTML=cert(p?.name||'Nome do(a) Atleta')}$('previewBtn').onclick=renderPreview;$('hours').oninput=renderPreview;$('signer').oninput=renderPreview;$('printBtn').onclick=()=>{const sel=people.filter(p=>p.selected);if(!eventData)return alert('Selecione um evento.');if(!sel.length)return alert('Selecione pelo menos um participante.');$('printArea').innerHTML=sel.map(p=>cert(p.name)).join('');$('printArea').classList.remove('hidden');setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},100)};init();</script></body></html>
