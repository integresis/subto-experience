<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Certificados</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#69768a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto}.top,.toolbar{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b{color:var(--o)}main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input,textarea{width:100%;border:1px solid #cad5e2;border-radius:10px;padding:11px;font:inherit}textarea{min-height:76px;resize:vertical}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.toolbar{gap:8px;flex-wrap:wrap}.list{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:12px}.person{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #edf1f5}.person input{width:20px;height:20px}.person label{flex:1}.preview-wrap{overflow:auto;padding:10px;background:#e9edf3;border-radius:12px}.certificate{position:relative;width:1120px;height:791px;background:#fff;color:var(--n);overflow:hidden;font-family:Arial,sans-serif;transform-origin:top left;border:2px solid #0a2757}.certificate:before{content:"";position:absolute;inset:14px;border:1.7px solid #0a2757;pointer-events:none}.frame-top,.frame-bottom{position:absolute;height:3px;background:#0a2757;left:150px;right:150px}.frame-top{top:23px}.frame-bottom{bottom:23px}.corner-tl,.corner-br{position:absolute;width:170px;height:88px;background:#082657;clip-path:polygon(0 0,100% 0,0 100%)}.corner-tl{left:0;top:0}.corner-br{right:0;bottom:0;transform:rotate(180deg)}.corner-tl:after,.corner-br:after{content:"";position:absolute;width:190px;height:8px;background:#f28a00;transform:rotate(-36deg);transform-origin:left center;left:-8px;top:77px}.corner-br:after{top:4px}.ghost{position:absolute;border:20px solid rgba(8,38,87,.018);border-radius:50%;width:180px;height:180px}.ghost.g1{left:-48px;top:408px}.ghost.g2{right:-48px;top:128px}.cert-content{position:absolute;left:78px;right:78px;top:44px;text-align:center}.subto{font-weight:900;font-style:italic;font-size:62px;letter-spacing:-6px;line-height:.95}.subto .b,.subto .o{color:var(--o)}.subto .o{display:inline-block;border:1px solid transparent}.experience{font-size:17px;font-weight:800;letter-spacing:10px;margin-top:10px}.experience:before,.experience:after{content:"";display:inline-block;width:30px;height:3px;background:var(--o);vertical-align:middle;margin:0 10px}.cert-title-row{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:18px}.cert-title{font-family:Georgia,"Times New Roman",serif;font-size:59px;letter-spacing:2px;font-weight:500}.orn-side{width:72px;height:1px;background:var(--o);position:relative}.orn-side:after{content:"◆";position:absolute;color:var(--o);font-size:9px;top:-6px}.orn-side.left:after{right:-3px}.orn-side.right:after{left:-3px}.orn-bottom{margin:-3px auto 13px;width:330px;color:var(--o);font-size:14px;letter-spacing:2px;border-top:1px solid #f3c07e;padding-top:2px}.cert-intro{font-size:18px;margin-top:2px}.cert-name{font-family:"Segoe Script","Brush Script MT",cursive;font-size:52px;line-height:1.1;margin:3px auto 4px;max-width:700px;padding:0 10px 7px;border-bottom:2px solid var(--o);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cert-body{font-size:18px;line-height:1.45;max-width:820px;margin:12px auto 0}.cert-body .event{color:var(--o);font-weight:800}.cert-body strong{font-weight:800}.info-row{display:flex;justify-content:center;align-items:stretch;margin:22px auto 0;max-width:720px}.info{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:2px 24px;border-right:1px solid var(--o);font-size:13px}.info:last-child{border-right:0}.ico{font-size:31px;line-height:1;color:var(--n)}.info b{display:block;font-size:15px}.info small{font-size:13px}.signature-block{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:300px;text-align:center}.signature-img{display:none;max-width:190px;max-height:58px;margin:0 auto -5px}.signature-line{border-top:1px solid var(--n);padding-top:6px;font-size:19px;font-weight:900}.signature-role{color:var(--o);font-weight:800;font-size:14px;margin-top:3px}.institution{position:absolute;right:56px;bottom:42px;width:210px;height:95px;display:flex;align-items:center;justify-content:center;text-align:center}.institution img{max-width:100%;max-height:100%;object-fit:contain}.institution-placeholder{font-size:13px;color:#8995a6;border:1px dashed #b9c2cf;border-radius:8px;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.count{font-weight:800;color:var(--n)}@media(max-width:700px){.grid{grid-template-columns:1fr}.certificate{transform:scale(.54);margin-bottom:-360px}.top{align-items:flex-start}.toolbar .btn{flex:1}}@media print{body{background:#fff}header,.no-print{display:none!important}main{padding:0}.wrap{max-width:none}.print-area{display:block!important}.certificate{transform:none!important;margin:0!important;width:297mm;height:210mm;page-break-after:always;break-after:page}.certificate:last-child{page-break-after:auto}.preview-wrap{padding:0;background:#fff;overflow:visible}.card{border:0;padding:0;margin:0}}@page{size:A4 landscape;margin:0}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BTo</b> Experience</div><div>Emissão de certificados</div></div><a href="./modules.html" class="btn secondary">Módulos</a></div></header><main class="wrap"><section class="no-print"><div class="card grid"><label><span>Evento</span><select id="eventSel"><option value="">Selecione</option></select></label><label><span>Modelo</span><select><option>Modelo 01 — Padrão suBTo</option></select></label><label><span>Turma</span><select id="classSel"><option value="all">Todas as turmas</option></select></label><label><span>Pesquisar atleta</span><input id="search" placeholder="Nome ou categoria"></label></div><div class="card"><div class="toolbar"><button id="allBtn" class="btn secondary">Selecionar todos</button><button id="noneBtn" class="btn secondary">Limpar seleção</button><span id="count" class="count">0 selecionados</span></div><div id="people" class="list" style="margin-top:12px"><div class="person muted">Selecione um evento.</div></div></div><div class="card"><strong>Campos editáveis do certificado</strong><div class="grid" style="margin-top:12px"><label><span>Profissional / responsável</span><input id="signer" value="Túlio Pimenta"></label><label><span>Cargo</span><input id="role" value="TREINADOR"></label><label><span>Carga horária</span><input id="hours" value="1 hora"></label><label><span>Local</span><input id="location" placeholder="Usar local do evento"></label><label><span>Logo da instituição (opcional)</span><input id="logoFile" type="file" accept="image/*"></label><label><span>Assinatura em imagem (opcional)</span><input id="signFile" type="file" accept="image/*"></label></div><label style="display:block;margin-top:12px"><span>Texto complementar</span><textarea id="bodyExtra">participando de uma experiência de formação e desenvolvimento voltada aos jovens atletas do Beach Tennis.</textarea></label><div class="muted" style="margin-top:8px">O Modelo 01 mantém a composição aprovada. Nome, evento, data, local, carga horária, responsável, cargo, logo institucional e assinatura podem variar.</div><div class="toolbar" style="margin-top:12px"><button id="previewBtn" class="btn secondary">Atualizar visualização</button><button id="printBtn" class="btn primary">Imprimir / salvar em PDF</button></div></div><div class="card"><strong>Pré-visualização — A4 paisagem</strong><div class="preview-wrap" style="margin-top:10px"><div id="singlePreview"></div></div></div></section><section id="printArea" class="print-area hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let eventData=null,people=[],moments=[],links=[],logoData='',signData='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function longDate(v){if(!v)return'29 de agosto de 2026';const[y,m,d]=String(v).slice(0,10).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}function cityLine(loc){return /palmas/i.test(loc)?'Palmas – TO':''}function cert(name){const date=longDate(eventData?.start_date),event=eventData?.name||'suBTo Experience',loc=$('location').value.trim()||eventData?.location||'AABB Palmas',signer=$('signer').value||'Túlio Pimenta',role=$('role').value||'TREINADOR',hours=$('hours').value||'1 hora',extra=$('bodyExtra').value||'';return `<article class="certificate"><div class="corner-tl"></div><div class="corner-br"></div><div class="frame-top"></div><div class="frame-bottom"></div><div class="ghost g1"></div><div class="ghost g2"></div><div class="cert-content"><div class="subto">su<span class="b">B</span>T<span class="o">o</span></div><div class="experience">EXPERIENCE</div><div class="cert-title-row"><span class="orn-side left"></span><div class="cert-title">CERTIFICADO</div><span class="orn-side right"></span></div><div class="orn-bottom">◆◆◆</div><div class="cert-intro">Certificamos que</div><div class="cert-name">${esc(name||'Nome do(a) Atleta')}</div><div class="cert-body">participou do <span class="event">${esc(event)}</span> com <strong>${esc(signer)}</strong>,<br>realizado no dia <strong>${esc(date)}</strong>, na ${esc(loc)},<br>${esc(extra)}</div><div class="info-row"><div class="info"><span class="ico">▣</span><div><b>${esc(date)}</b></div></div><div class="info"><span class="ico">⌖</span><div><b>${esc(loc)}</b><small>${esc(cityLine(loc))}</small></div></div><div class="info"><span class="ico">◷</span><div><small>Carga horária:</small><b>${esc(hours)}</b></div></div></div></div><div class="signature-block">${signData?`<img class="signature-img" style="display:block" src="${signData}">`:''}<div class="signature-line">${esc(signer)}</div><div class="signature-role">${esc(role)}</div></div><div class="institution">${logoData?`<img src="${logoData}">`:'<div class="institution-placeholder">Logo da instituição</div>'}</div></article>`}function readImage(input,cb){const f=input.files&&input.files[0];if(!f){cb('');return}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const{data,error}=await sb.from('events').select('*').order('start_date',{ascending:false});if(error)return alert(error.message);$('eventSel').innerHTML='<option value="">Selecione</option>'+(data||[]).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');$('eventSel')._events=data||[];renderPreview()}$('eventSel').onchange=loadEvent;async function loadEvent(){const id=$('eventSel').value;eventData=($('eventSel')._events||[]).find(e=>e.id===id)||null;if(!id){people=[];renderPeople();renderPreview();return}const [p,m,a]=await Promise.all([sb.from('event_participants').select('id,athlete_id').eq('event_id',id),sb.from('event_moments').select('id,name,start_time').eq('event_id',id).order('activity_date').order('start_time'),sb.from('event_moment_athletes').select('moment_id,event_participant_id')]);if(p.error||m.error||a.error)return alert((p.error||m.error||a.error).message);moments=m.data||[];links=(a.data||[]).filter(x=>moments.some(mm=>mm.id===x.moment_id));const parts=p.data||[],ids=parts.map(x=>x.athlete_id).filter(Boolean);let athletes=[];if(ids.length){const r=await sb.from('athlete_submissions').select('id,athlete_name,category').in('id',ids).order('athlete_name');if(r.error)return alert(r.error.message);athletes=r.data||[]}people=parts.map(p=>{const x=athletes.find(a=>a.id===p.athlete_id);return x?{participant_id:p.id,id:x.id,name:x.athlete_name,category:x.category,selected:true}:null}).filter(Boolean);$('classSel').innerHTML='<option value="all">Todas as turmas</option>'+moments.map(m=>`<option value="${m.id}">${esc(m.name)} · ${String(m.start_time||'').slice(0,5)}</option>`).join('');$('location').value=eventData?.location||'';renderPeople();renderPreview()}function visiblePeople(){const q=$('search').value.trim().toLowerCase(),cl=$('classSel').value;return people.filter(p=>(!q||p.name.toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q))&&(cl==='all'||links.some(l=>l.moment_id===cl&&l.event_participant_id===p.participant_id)))}function renderPeople(){const v=visiblePeople();$('people').innerHTML=v.length?v.map(p=>`<div class="person"><input type="checkbox" data-id="${p.id}" ${p.selected?'checked':''}><label><b>${esc(p.name)}</b><br><small>${esc(p.category||'Atleta')}</small></label></div>`).join(''):'<div class="person muted">Nenhum participante encontrado.</div>';updateCount()}function updateCount(){const n=people.filter(p=>p.selected).length;$('count').textContent=`${n} selecionado${n===1?'':'s'}`}$('people').onchange=e=>{if(e.target.matches('[data-id]')){const p=people.find(x=>x.id===e.target.dataset.id);if(p)p.selected=e.target.checked;updateCount();renderPreview()}};$('search').oninput=renderPeople;$('classSel').onchange=renderPeople;$('allBtn').onclick=()=>{visiblePeople().forEach(p=>p.selected=true);renderPeople();renderPreview()};$('noneBtn').onclick=()=>{people.forEach(p=>p.selected=false);renderPeople();renderPreview()};function renderPreview(){const p=people.find(x=>x.selected)||people[0];$('singlePreview').innerHTML=cert(p?.name||'Nome do(a) Atleta')}['signer','role','hours','location','bodyExtra'].forEach(id=>$(id).oninput=renderPreview);$('logoFile').onchange=()=>readImage($('logoFile'),x=>{logoData=x;renderPreview()});$('signFile').onchange=()=>readImage($('signFile'),x=>{signData=x;renderPreview()});$('previewBtn').onclick=renderPreview;$('printBtn').onclick=()=>{const sel=people.filter(p=>p.selected);if(!eventData)return alert('Selecione um evento.');if(!sel.length)return alert('Selecione pelo menos um participante.');$('printArea').innerHTML=sel.map(p=>cert(p.name)).join('');$('printArea').classList.remove('hidden');setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},180)};init();</script></body></html>
