<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Certificados</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#69768a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto}.top,.toolbar{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b{color:var(--o)}main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input,textarea{width:100%;border:1px solid #cad5e2;border-radius:10px;padding:11px;font:inherit}textarea{min-height:80px;resize:vertical}label span{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.toolbar{gap:8px;flex-wrap:wrap}.list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}.person{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #edf1f5}.person input{width:20px;height:20px}.person label{flex:1}.preview-wrap{overflow:auto;padding:8px;background:#e9edf3;border-radius:12px}.certificate{position:relative;width:1120px;height:792px;background:#fff;color:var(--n);overflow:hidden;font-family:Arial,sans-serif;transform-origin:top left;border:2px solid var(--n)}.certificate:before{content:"";position:absolute;inset:13px;border:1px solid var(--n)}.swash-tl,.swash-br{position:absolute;width:230px;height:42px;background:var(--n);transform:skewX(-38deg)}.swash-tl{left:-35px;top:0;border-bottom:8px solid var(--o)}.swash-br{right:-35px;bottom:0;border-top:8px solid var(--o)}.watermark{position:absolute;width:190px;height:190px;border:24px solid rgba(8,38,87,.025);border-radius:50%;left:-60px;top:390px}.cert-inner{position:absolute;inset:38px 70px;text-align:center}.logo{font-size:53px;font-weight:900;font-style:italic;letter-spacing:-4px;line-height:1}.logo .b,.logo .o{color:var(--o)}.experience{font-size:15px;letter-spacing:8px;font-weight:800;margin:7px 0 22px}.cert-title{font-family:Georgia,serif;font-size:55px;letter-spacing:3px;margin:0}.orn{color:var(--o);font-size:18px;letter-spacing:8px;margin:2px 0 12px}.cert-intro{font-size:17px}.cert-name{font-family:"Brush Script MT","Segoe Script",cursive;font-size:48px;margin:4px auto 5px;max-width:750px;border-bottom:2px solid var(--o);padding-bottom:4px}.cert-body{font-size:18px;line-height:1.45;max-width:850px;margin:12px auto}.cert-body strong{font-weight:800}.accent{color:var(--o)}.info-row{display:flex;justify-content:center;margin:18px auto 0;max-width:720px}.info{flex:1;padding:4px 18px;border-right:1px solid var(--o);font-size:13px}.info:last-child{border-right:0}.info b{display:block;font-size:15px}.signature{margin:24px auto 0;width:290px;border-top:1px solid var(--n);padding-top:5px;font-weight:900}.signature small{display:block;color:var(--o);font-weight:700;margin-top:3px}.partner-slot{position:absolute;right:65px;bottom:52px;width:190px;height:82px;border:1px dashed #b9c2cf;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8995a6;font-size:12px}.partner-slot b{display:block;color:var(--n);font-size:14px}.count{font-weight:800;color:var(--n)}@media(max-width:700px){.grid{grid-template-columns:1fr}.certificate{transform:scale(.54);margin-bottom:-360px}.top{align-items:flex-start}.toolbar .btn{flex:1}}@media print{body{background:#fff}header,.no-print{display:none!important}main{padding:0}.wrap{max-width:none}.print-area{display:block!important}.certificate{transform:none!important;margin:0!important;width:297mm;height:210mm;page-break-after:always;break-after:page}.certificate:last-child{page-break-after:auto}.cert-inner{inset:10mm 18mm}.preview-wrap{padding:0;background:#fff;overflow:visible}.card{border:0;padding:0;margin:0}}@page{size:A4 landscape;margin:0}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BTo</b> Experience</div><div>Emissão de certificados</div></div><a href="./modules.html" class="btn secondary">Módulos</a></div></header><main class="wrap"><section class="no-print"><div class="card grid"><label><span>Evento</span><select id="eventSel"><option value="">Selecione</option></select></label><label><span>Modelo</span><select><option>Modelo 01 — Padrão suBTo</option></select></label><label><span>Turma</span><select id="classSel"><option value="all">Todas as turmas</option></select></label><label><span>Pesquisar atleta</span><input id="search" placeholder="Nome ou categoria"></label></div><div class="card"><div class="toolbar"><button id="allBtn" class="btn secondary">Selecionar todos</button><button id="noneBtn" class="btn secondary">Limpar seleção</button><span id="count" class="count">0 selecionados</span></div><div id="people" class="list" style="margin-top:12px"><div class="person muted">Selecione um evento.</div></div></div><div class="card"><strong>Campos editáveis do certificado</strong><div class="grid" style="margin-top:12px"><label><span>Profissional / responsável</span><input id="signer" value="Túlio Pimenta"></label><label><span>Cargo</span><input id="role" value="TREINADOR"></label><label><span>Carga horária</span><input id="hours" value="1 hora"></label><label><span>Local</span><input id="location" placeholder="Usar local cadastrado no evento"></label></div><label style="display:block;margin-top:12px"><span>Texto complementar</span><textarea id="bodyExtra">participando de uma experiência de formação e desenvolvimento voltada aos jovens atletas do Beach Tennis.</textarea></label><div class="muted" style="margin-top:8px">A logo suBTo é fixa. O espaço inferior direito fica reservado para a logo variável da instituição/organizador.</div><div class="toolbar" style="margin-top:12px"><button id="previewBtn" class="btn secondary">Atualizar visualização</button><button id="printBtn" class="btn primary">Imprimir / salvar em PDF</button></div></div><div class="card"><strong>Pré-visualização — A4 paisagem</strong><div class="preview-wrap" style="margin-top:10px"><div id="singlePreview"></div></div></div></section><section id="printArea" class="print-area hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let eventData=null,people=[],moments=[],links=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function longDate(v){if(!v)return'29 de agosto de 2026';const[y,m,d]=String(v).slice(0,10).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}function cert(name){const date=longDate(eventData?.start_date),event=eventData?.name||'suBTo Experience',loc=$('location').value.trim()||eventData?.location||'AABB Palmas',signer=$('signer').value||'Túlio Pimenta',role=$('role').value||'TREINADOR',hours=$('hours').value||'1 hora',extra=$('bodyExtra').value||'';return `<article class="certificate"><div class="swash-tl"></div><div class="swash-br"></div><div class="watermark"></div><div class="cert-inner"><div class="logo">su<span class="b">B</span>T<span class="o">o</span></div><div class="experience">— EXPERIENCE —</div><div class="cert-title">CERTIFICADO</div><div class="orn">◆ ───── ◆◆◆ ───── ◆</div><div class="cert-intro">Certificamos que</div><div class="cert-name">${esc(name||'Nome do(a) Atleta')}</div><div class="cert-body">participou do <strong class="accent">${esc(event)}</strong> com <strong>${esc(signer)}</strong>,<br>realizado no dia <strong>${esc(date)}</strong>, na <strong>${esc(loc)}</strong>,<br>${esc(extra)}</div><div class="info-row"><div class="info">📅 <b>${esc(date)}</b></div><div class="info">⌖ <b>${esc(loc)}</b><span>Palmas – TO</span></div><div class="info">◷ Carga horária:<b>${esc(hours)}</b></div></div><div class="signature">${esc(signer)}<small>${esc(role)}</small></div></div><div class="partner-slot"><div><b>LOGO DA INSTITUIÇÃO</b>campo variável</div></div></article>`}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const{data,error}=await sb.from('events').select('*').order('start_date',{ascending:false});if(error)return alert(error.message);$('eventSel').innerHTML='<option value="">Selecione</option>'+(data||[]).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');$('eventSel')._events=data||[];renderPreview()}$('eventSel').onchange=loadEvent;async function loadEvent(){const id=$('eventSel').value;eventData=($('eventSel')._events||[]).find(e=>e.id===id)||null;if(!id){people=[];renderPeople();renderPreview();return}const [p,m,a]=await Promise.all([sb.from('event_participants').select('id,athlete_id').eq('event_id',id),sb.from('event_moments').select('id,name,start_time').eq('event_id',id).order('activity_date').order('start_time'),sb.from('event_moment_athletes').select('moment_id,event_participant_id')]);if(p.error||m.error||a.error)return alert((p.error||m.error||a.error).message);moments=m.data||[];links=(a.data||[]).filter(x=>moments.some(mm=>mm.id===x.moment_id));const parts=p.data||[],ids=parts.map(x=>x.athlete_id).filter(Boolean);let athletes=[];if(ids.length){const r=await sb.from('athlete_submissions').select('id,athlete_name,category').in('id',ids).order('athlete_name');if(r.error)return alert(r.error.message);athletes=r.data||[]}people=parts.map(p=>{const x=athletes.find(a=>a.id===p.athlete_id);return x?{participant_id:p.id,id:x.id,name:x.athlete_name,category:x.category,selected:true}:null}).filter(Boolean);$('classSel').innerHTML='<option value="all">Todas as turmas</option>'+moments.map(m=>`<option value="${m.id}">${esc(m.name)} · ${String(m.start_time||'').slice(0,5)}</option>`).join('');if(!$('location').value)$('location').placeholder=eventData?.location||'Local';renderPeople();renderPreview()}function visiblePeople(){const q=$('search').value.trim().toLowerCase(),cl=$('classSel').value;return people.filter(p=>(!q||p.name.toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q))&&(cl==='all'||links.some(l=>l.moment_id===cl&&l.event_participant_id===p.participant_id)))}function renderPeople(){const v=visiblePeople();$('people').innerHTML=v.length?v.map(p=>`<div class="person"><input type="checkbox" data-id="${p.id}" ${p.selected?'checked':''}><label><b>${esc(p.name)}</b><br><small>${esc(p.category||'Atleta')}</small></label></div>`).join(''):'<div class="person muted">Nenhum participante encontrado.</div>';updateCount()}function updateCount(){const n=people.filter(p=>p.selected).length;$('count').textContent=`${n} selecionado${n===1?'':'s'}`}$('people').onchange=e=>{if(e.target.matches('[data-id]')){const p=people.find(x=>x.id===e.target.dataset.id);if(p)p.selected=e.target.checked;updateCount();renderPreview()}};$('search').oninput=renderPeople;$('classSel').onchange=renderPeople;$('allBtn').onclick=()=>{visiblePeople().forEach(p=>p.selected=true);renderPeople();renderPreview()};$('noneBtn').onclick=()=>{people.forEach(p=>p.selected=false);renderPeople();renderPreview()};function renderPreview(){const p=people.find(x=>x.selected)||people[0];$('singlePreview').innerHTML=cert(p?.name||'Nome do(a) Atleta')}['signer','role','hours','location','bodyExtra'].forEach(id=>$(id).oninput=renderPreview);$('previewBtn').onclick=renderPreview;$('printBtn').onclick=()=>{const sel=people.filter(p=>p.selected);if(!eventData)return alert('Selecione um evento.');if(!sel.length)return alert('Selecione pelo menos um participante.');$('printArea').innerHTML=sel.map(p=>cert(p.name)).join('');$('printArea').classList.remove('hidden');setTimeout(()=>{window.print();$('printArea').classList.add('hidden')},150)};init();</script></body></html>
