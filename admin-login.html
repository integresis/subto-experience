<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>suBTo Experience — Acesso Administrativo</title>
<style>
:root{--navy:#082657;--orange:#f28a00;--bg:#f5f7fa;--ink:#1f2f49;--muted:#6b7587;--line:#dde4ed}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),#104488);color:#fff;padding:22px 18px}.wrap{max-width:520px;margin:auto}.brand{font-weight:900;font-size:26px}.brand b{color:var(--orange)}header p{margin:5px 0 0;opacity:.85}.card{margin:48px 16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 34px #08265714}.card h1{margin:0 0 10px;color:var(--navy);font-size:32px}.muted{color:var(--muted);font-size:14px;line-height:1.5}input{width:100%;border:1px solid #cfd8e5;border-radius:12px;padding:14px;font:inherit;margin-top:12px}button{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;background:var(--orange);color:#fff;margin-top:12px;font-size:16px}.msg{margin-top:14px;font-size:14px;line-height:1.45}.ok{color:#176b40}.err{color:#a52a2a}</style>
</head>
<body>
<header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><p>Acesso administrativo</p></div></header>
<div class="wrap"><section class="card"><h1>Entrar no painel</h1><p class="muted">Digite um e-mail previamente autorizado. Se for o primeiro acesso, o usuário de autenticação será criado automaticamente apenas para esse e-mail autorizado.</p><input id="email" type="email" placeholder="seu@email.com" autocomplete="email"><button id="send">Enviar link de acesso</button><div id="msg" class="msg"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');
const email=document.getElementById('email'),msg=document.getElementById('msg'),btn=document.getElementById('send');
btn.onclick=async()=>{const value=email.value.trim().toLowerCase();msg.textContent='';msg.className='msg';if(!value){msg.textContent='Digite o e-mail.';msg.classList.add('err');return}btn.disabled=true;btn.textContent='Verificando...';const {data:allowed,error:checkError}=await sb.rpc('is_admin_email',{p_email:value});if(checkError||!allowed){msg.textContent='Este e-mail não está autorizado para o painel.';msg.classList.add('err');btn.disabled=false;btn.textContent='Enviar link de acesso';return}btn.textContent='Enviando...';const {error}=await sb.auth.signInWithOtp({email:value,options:{emailRedirectTo:location.origin+'/admin.html',shouldCreateUser:true}});if(error){msg.textContent=error.message;msg.classList.add('err')}else{msg.textContent='Link enviado. Abra o e-mail e toque em Sign in. Depois disso, o acesso ficará salvo neste navegador enquanto a sessão estiver válida.';msg.classList.add('ok')}btn.disabled=false;btn.textContent='Enviar link de acesso'};
</script>
</body>
</html>
