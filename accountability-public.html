<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Prestação de Contas</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f4f7fb;--ink:#20314b;--muted:#6d7889;--line:#dce4ee;--green:#177245;--red:#9e3737}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:28px 16px}.wrap{max-width:1050px;margin:auto}.brand{font-size:27px;font-weight:900}.brand b{color:var(--o)}header p{margin:6px 0 0;opacity:.86}main{padding:22px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric span{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}.metric b{font-size:22px;color:var(--n)}.support b{color:#66489a}.pos{color:var(--green)!important}.neg{color:var(--red)!important}h1,h2{color:var(--n)}h1{margin:0;font-size:25px}h2{font-size:18px;margin:0 0 12px}.meta{color:var(--muted);font-size:13px;margin-top:6px}.report{white-space:pre-wrap;line-height:1.6}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:800px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.receita{background:#e9f7ef;color:#17643e}.despesa{background:#fff0f0;color:#9c3434}.apoio{background:#f0ebfb;color:#64449b}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--o);color:#fff}.top-actions{display:flex;justify-content:flex-end;margin-bottom:12px}.error,.loading{max-width:800px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}.hidden{display:none!important}@media(max-width:780px){.grid4{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid4{grid-template-columns:1fr}}@media print{body{background:#fff}.top-actions{display:none}.card,.metric{box-shadow:none;break-inside:avoid}header{padding:18px 0;background:#fff;color:var(--ink);border-bottom:3px solid var(--n)}header .brand,header h1{color:var(--n)}header p{color:var(--muted)}}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><p>Transparência e prestação de contas</p></div></header><main class="wrap"><div id="loading" class="loading">Carregando prestação de contas...</div><div id="error" class="error hidden"></div><div id="app" class="hidden"><div class="top-actions"><button class="btn" onclick="window.print()">Imprimir / salvar PDF</button></div><section class="card"><h1 id="eventName"></h1><div id="eventMeta" class="meta"></div></section><div class="grid4"><div class="metric"><span>Receitas</span><b id="revenue">R$ 0,00</b></div><div class="metric"><span>Despesas</span><b id="expense">R$ 0,00</b></div><div class="metric"><span>Saldo financeiro</span><b id="balance">R$ 0,00</b></div><div class="metric support"><span>Apoios / doações</span><b id="support">R$ 0,00</b></div></div><section id="reportCard" class="card hidden" style="margin-top:16px"><h2>Relatório do evento</h2><div id="report" class="report"></div></section><section class="card"><h2>Lançamentos</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Natureza</th><th>Categoria</th><th>Descrição</th><th>Responsável</th><th>Valor</th><th>Documento</th></tr></thead><tbody id="entries"></tbody></table></div><div id="empty" class="meta" style="padding-top:12px">Nenhum lançamento informado.</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function typeLabel(t){return t==='receita'?'Receita':t==='despesa'?'Despesa':'Apoio / doação'}function br(v){if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}function fail(m){$('loading').classList.add('hidden');$('error').textContent=m;$('error').classList.remove('hidden')}async function init(){const token=new URLSearchParams(location.search).get('t');if(!token)return fail('Link inválido ou incompleto.');const a=await sb.from('event_accountability').select('id,event_name,event_date,event_location,report_text,published').eq('public_token',token).eq('published',true).maybeSingle();if(a.error)return fail(a.error.message);if(!a.data)return fail('Esta prestação de contas não está disponível ou deixou de ser publicada.');const r=await sb.from('event_accountability_entries').select('*').eq('accountability_id',a.data.id).order('entry_date',{ascending:true}).order('created_at',{ascending:true});if(r.error)return fail(r.error.message);const rows=r.data||[];$('eventName').textContent=a.data.event_name||'Prestação de contas';$('eventMeta').textContent=[br(a.data.event_date),a.data.event_location].filter(Boolean).join(' · ');if(a.data.report_text){$('report').textContent=a.data.report_text;$('reportCard').classList.remove('hidden')}const rev=rows.filter(x=>x.entry_type==='receita').reduce((s,x)=>s+Number(x.amount),0),exp=rows.filter(x=>x.entry_type==='despesa').reduce((s,x)=>s+Number(x.amount),0),sup=rows.filter(x=>x.entry_type==='apoio').reduce((s,x)=>s+Number(x.amount),0),bal=rev-exp;$('revenue').textContent=money(rev);$('expense').textContent=money(exp);$('support').textContent=money(sup);$('balance').textContent=money(bal);$('balance').className=bal<0?'neg':'pos';$('empty').classList.toggle('hidden',rows.length>0);$('entries').innerHTML=rows.map(x=>{const doc=x.document_path?sb.storage.from('accountability-documents').getPublicUrl(x.document_path).data.publicUrl:'';return `<tr><td>${esc(br(x.entry_date)||'—')}</td><td><span class="tag ${esc(x.entry_type)}">${esc(typeLabel(x.entry_type))}</span></td><td>${esc(x.category)}</td><td><b>${esc(x.description)}</b>${x.notes?`<div class="meta">${esc(x.notes)}</div>`:''}</td><td>${esc(x.party_name||'—')}</td><td><b>${money(x.amount)}</b></td><td>${doc?`<a href="${esc(doc)}" target="_blank" rel="noopener">Abrir</a>`:'—'}</td></tr>`}).join('');$('loading').classList.add('hidden');$('app').classList.remove('hidden')}init();</script></body></html>
