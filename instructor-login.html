<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Acesso do Instrutor</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1f2f49}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:24px 18px}.wrap{max-width:480px;margin:auto}.brand{font-size:27px;font-weight:900}.brand b{color:var(--o)}main{padding:30px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.muted{font-size:13px;color:var(--muted);line-height:1.45}input{width:100%;padding:12px;border:1px solid #ccd6e3;border-radius:10px;font:inherit;margin-top:10px}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;margin-top:11px}.primary{background:var(--o);color:#fff}.msg{font-size:13px;margin-top:10px;color:var(--red)}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Acesso do Instrutor</div></div></header><main class="wrap"><div class="card"><h1>Entrar</h1><p class="muted">Este acesso é exclusivo para instrutores convidados. Ele permite somente visualizar as turmas liberadas e registrar avaliações.</p><input id="email" type="email" autocomplete="username" placeholder="E-mail"><input id="password" type="password" autocomplete="current-password" placeholder="Senha"><button id="enter" class="btn primary">Entrar na avaliação</button><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');async function validate(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data:ok}=await sb.rpc('is_instructor');if(ok){location.replace('./instructor-evaluations.html');return true}return false}enter.onclick=async()=>{msg.textContent='';const e=email.value.trim(),p=password.value;if(!e||!p){msg.textContent='Informe e-mail e senha.';return}enter.disabled=true;const{error}=await sb.auth.signInWithPassword({email:e,password:p});enter.disabled=false;if(error){msg.textContent='E-mail ou senha inválidos.';return}const{data:ok}=await sb.rpc('is_instructor');if(!ok){await sb.auth.signOut();msg.textContent='Este usuário não possui acesso de instrutor.';return}location.replace('./instructor-evaluations.html')};validate();</script></body></html>
