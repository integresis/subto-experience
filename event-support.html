<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Apoio das Turmas</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1f2f49}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:1000px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:18px 14px 50px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #edf1f5;padding:9px 0}.pinfo{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eef2f6;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8793a5;flex:0 0 42px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.danger{background:#fff0ee;color:var(--red)}select,input{width:100%;padding:10px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}.filters{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin:12px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{font-size:13px;color:var(--muted)}.hidden{display:none!important}@media(max-width:700px){.cols,.filters{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Apoio das Turmas</div></div></header><main class="wrap"><div id="blocked" class="card hidden">Acesso restrito. Entre primeiro pelo painel administrativo.</div><div id="app" class="hidden"><div class="card"><label><strong>Evento</strong><select id="eventSel"></select></label><br><label><strong>Turma</strong><select id="momentSel"></select></label></div><div class="cols"><section class="panel"><h3>Professores disponíveis</h3><div class="filters"><input id="q" placeholder="Pesquisar professor"><select id="arenaSel"><option value="">Todas as arenas</option></select></div><div id="available"></div></section><section class="panel"><h3>Apoio desta turma</h3><div class="muted">Sem limite. O mesmo professor pode apoiar várias turmas.</div><div id="included"></div></section></div><a class="btn secondary" href="./events.html" style="text-decoration:none">Voltar para Eventos</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');let events=[],moments=[],teachers=[],supports=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const arena=t=>t.club_name==='Outro'?(t.club_other||'Outro'):(t.club_name||'');async function photo(t){if(!t.photo_path)return'';const {data}=await sb.storage.from('teacher-photos').createSignedUrl(t.photo_path,3600);return data?.signedUrl||''}function avatar(t){return t.photo_url?`<img class="avatar" src="${esc(t.photo_url)}" alt="">`:`<div class="avatar">${esc((t.name||'?')[0].toUpperCase())}</div>`}async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return blocked.classList.remove('hidden');const {data:ok}=await sb.rpc('is_admin');if(!ok)return blocked.classList.remove('hidden');app.classList.remove('hidden');const [e,t]=await Promise.all([sb.from('events').select('id,name,start_date').order('start_date',{ascending:false}),sb.from('teachers').select('id,name,club_name,club_other,photo_path').order('name')]);if(e.error||t.error)return alert((e.error||t.error).message);events=e.data||[];teachers=t.data||[];await Promise.all(teachers.map(async x=>x.photo_url=await photo(x)));eventSel.innerHTML=events.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const as=[...new Set(teachers.map(arena).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));arenaSel.innerHTML='<option value="">Todas as arenas</option>'+as.map(x=>`<option>${esc(x)}</option>`).join('');await loadMoments()}async function loadMoments(){const eventId=eventSel.value;if(!eventId){momentSel.innerHTML='';return render()}const {data,error}=await sb.from('event_moments').select('*').eq('event_id',eventId).order('activity_date').order('start_time').order('location');if(error)return alert(error.message);moments=data||[];momentSel.innerHTML=moments.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.location)} · ${esc(String(m.start_time).slice(0,5))}</option>`).join('');await loadSupports()}async function loadSupports(){if(!momentSel.value){supports=[];return render()}const {data,error}=await sb.from('event_moment_support').select('*').eq('moment_id',momentSel.value);if(error)return alert(error.message);supports=data||[];render()}function render(){const used=new Set(supports.map(x=>x.teacher_id)),qq=q.value.trim().toLowerCase(),ar=arenaSel.value;const avail=teachers.filter(t=>!used.has(t.id)&&(!qq||t.name.toLowerCase().includes(qq))&&(!ar||arena(t)===ar));available.innerHTML=avail.length?'':'<div class="muted">Nenhum professor disponível.</div>';avail.forEach(t=>available.insertAdjacentHTML('beforeend',`<div class="row"><div class="pinfo">${avatar(t)}<span><strong>${esc(t.name)}</strong><br><span class="muted">${esc(arena(t))}</span></span></div><button class="btn primary" data-add="${t.id}">Adicionar</button></div>`));included.innerHTML=supports.length?'':'<div class="muted" style="margin-top:12px">Nenhum apoio nesta turma.</div>';supports.forEach(s=>{const t=teachers.find(x=>x.id===s.teacher_id);if(!t)return;included.insertAdjacentHTML('beforeend',`<div class="row"><div class="pinfo">${avatar(t)}<span><strong>${esc(t.name)}</strong><br><span class="muted">${esc(arena(t))}</span></span></div><button class="btn danger" data-remove="${s.id}">Remover</button></div>`)})}eventSel.onchange=loadMoments;momentSel.onchange=loadSupports;q.oninput=render;arenaSel.onchange=render;available.onclick=async e=>{const b=e.target.closest('[data-add]');if(!b||!momentSel.value)return;const {error}=await sb.from('event_moment_support').insert({moment_id:momentSel.value,teacher_id:b.dataset.add});if(error)return alert(error.message);loadSupports()};included.onclick=async e=>{const b=e.target.closest('[data-remove]');if(!b)return;if(!confirm('Remover este professor do apoio desta turma? O cadastro do professor não será alterado.'))return;const {error}=await sb.from('event_moment_support').delete().eq('id',b.dataset.remove);if(error)return alert(error.message);loadSupports()};init();</script></body></html>
