<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>suBTo — Pesquisa das famílias</title>
<style>
:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#68758a;--green:#177245;--red:#9e3737}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:980px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}h2{margin:0 0 12px;color:var(--n);font-size:19px}select,input[type=search]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}.muted{color:var(--muted);font-size:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f7f9fc;border-radius:12px;padding:12px;min-width:130px}.stat b{display:block;font-size:22px;color:var(--n)}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px;margin-top:15px}.filters label{font-size:11px;font-weight:800;color:var(--muted)}.filters input,.filters select{margin-top:4px}.item{border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}.done{color:var(--green);font-weight:900}.science-line{font-size:12px;color:var(--muted);margin-top:3px}.science-line b{color:var(--n)}.science-ok{color:var(--green);font-weight:800}.science-pending{color:#8a5b12;font-weight:700}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.6;cursor:default}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.success{background:#e9f7ef;color:#17643e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.summary-q{border:1px solid var(--line);border-radius:12px;padding:12px}.summary-q h3{font-size:13px;margin:0 0 8px;color:var(--n)}.barline{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12px}.modal{position:fixed;inset:0;background:#07152dcc;z-index:9999;padding:18px;overflow:auto}.modalbox{max-width:820px;margin:auto;background:#fff;border-radius:18px;overflow:hidden}.modalhead{background:var(--n);color:#fff;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modalbody{padding:16px}.science-box{border:1px solid #cfe0ef;background:#f7fbff;border-radius:13px;padding:13px;margin-bottom:14px}.science-title{font-weight:900;color:var(--n);margin-bottom:6px}.science-readers{font-size:13px;line-height:1.6}.science-actions{margin-top:10px}.answer{border-bottom:1px solid var(--line);padding:13px 0}.answer:last-child{border:0}.answer h3{font-size:13px;color:var(--n);margin:0 0 7px}.answer-value{white-space:pre-wrap;line-height:1.45}.rating{font-size:18px;font-weight:900;color:var(--o)}.answer-nav{border-top:2px solid var(--line);margin-top:18px;padding-top:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.answer-nav .next{justify-self:end}.answer-nav .navpos{text-align:center;color:var(--muted);font-size:12px;font-weight:800}audio{width:100%;margin-top:8px}.hidden{display:none!important}
@media(max-width:720px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.stat{min-width:calc(33% - 8px);flex:1;padding:9px}.stat b{font-size:19px}.summary-grid{grid-template-columns:1fr}.modal{padding:0}.modalbox{border-radius:0;min-height:100vh}.answer-nav{grid-template-columns:1fr 1fr}.answer-nav .navpos{grid-column:1/-1;grid-row:1}.answer-nav .prev{grid-column:1;grid-row:2}.answer-nav .next{grid-column:2;grid-row:2}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Pesquisa das famílias</div></div></header>
<main class="wrap">
  <div class="card"><label><b>Evento</b><select id="eventSel"><option value="">Selecione...</option></select></label></div>
  <div id="summary" class="card hidden"><div id="stats"></div><div class="filters"><label class="search">Buscar atleta<input id="nameFilter" type="search" placeholder="Digite o nome..."></label><label>Turma<select id="momentFilter"><option value="">Todas</option></select></label><label>Categoria<select id="categoryFilter"><option value="">Todas</option></select></label><label>Arena / Clube<select id="clubFilter"><option value="">Todos</option></select></label><label>Status<select id="statusFilter"><option value="">Todos</option><option value="pending">Não respondeu</option><option value="done">Respondida</option></select></label></div></div>
  <section id="answersSummary" class="card hidden"><h2>Resumo das respostas</h2><div id="summaryContent" class="summary-grid"></div></section>
  <div id="list" class="card muted">Selecione o evento.</div>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div><b id="modalName">Respostas</b><div id="modalMeta" style="font-size:12px;opacity:.85"></div></div><button id="closeModal" class="btn secondary">Fechar</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),$=id=>document.getElementById(id);
const eventSel=$('eventSel'),summary=$('summary'),stats=$('stats'),list=$('list'),nameFilter=$('nameFilter'),momentFilter=$('momentFilter'),categoryFilter=$('categoryFilter'),clubFilter=$('clubFilter'),statusFilter=$('statusFilter'),answersSummary=$('answersSummary'),summaryContent=$('summaryContent');
let allRows=[],questions=[],answers=[],audios=[],readReceipts=[],currentAnswerId=null,currentUser=null,currentReaderName='';
const SCIENCE_NAMES=['Charles','Marcos'];
const ADMIN_NAME_BY_EMAIL={'integresis@gmail.com':'Charles','campagnolli.mr@gmail.com':'Marcos'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function url(t){return `${location.origin}/family-survey.html?t=${t}`}
window.copyMsg=async(t,name)=>{const u=url(t),msg=`Olá! Queremos ouvir você e também ${name} sobre o suBTo Experience. É uma pesquisa rápida, de menos de 1 minuto. Este link é exclusivo da pesquisa referente a ${name}: ${u}`;await navigator.clipboard.writeText(msg);alert('Mensagem copiada.')};
window.openWa=(t,name,phone)=>{const u=url(t),msg=`Olá! Queremos ouvir você e também ${name} sobre o suBTo Experience. É uma pesquisa rápida, de menos de 1 minuto. Este link é exclusivo da pesquisa referente a ${name}: ${u}`;const p=String(phone||'').replace(/\D/g,'');window.open(`https://wa.me/${p?('55'+p.replace(/^55/,'')):''}?text=${encodeURIComponent(msg)}`,'_blank')};
function unique(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'}))}
function setOptions(el,values,first){el.innerHTML=`<option value="">${first}</option>`+unique(values).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function answerText(v){if(v==null||v==='')return '—';if(Array.isArray(v))return v.join(', ');if(typeof v==='object')return Object.entries(v).map(([k,x])=>`${k}: ${x}/5`).join('\n');return String(v)}
function receiptList(invitationId){return readReceipts.filter(r=>r.invitation_id===invitationId).sort((a,b)=>new Date(a.read_at)-new Date(b.read_at))}
function hasReceipt(invitationId,userId=currentUser?.id){return !!userId&&readReceipts.some(r=>r.invitation_id===invitationId&&r.user_id===userId)}
function scienceStatusHtml(invitationId){const names=new Set(receiptList(invitationId).map(r=>r.reader_name));return `<div class="science-line"><b>Ciência:</b> ${SCIENCE_NAMES.map(n=>names.has(n)?`<span class="science-ok">${esc(n)} ✓</span>`:`<span class="science-pending">${esc(n)} pendente</span>`).join(' · ')}</div>`}
function fmtReadAt(value){if(!value)return '';try{return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}catch{return ''}}
function aggregate(){const submittedIds=new Set(allRows.filter(x=>x.submitted_at).map(x=>x.id));const valid=answers.filter(a=>submittedIds.has(a.invitation_id));const cards=[];for(const q of questions){const arr=valid.filter(a=>a.question_id===q.id).map(a=>a.answer).filter(v=>v!==''&&v!=null);if(!arr.length)continue;if(q.question_type==='rating'){const avg=arr.reduce((s,v)=>s+Number(v||0),0)/arr.length;cards.push(`<div class="summary-q"><h3>${esc(q.label)}</h3><div class="rating">${avg.toFixed(1)} / 5</div><div class="muted">${arr.length} resposta(s)</div></div>`)}else if(q.question_type==='single_choice'||q.question_type==='multi_choice'){const counts={};arr.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>counts[x]=(counts[x]||0)+1));const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);cards.push(`<div class="summary-q"><h3>${esc(q.label)}</h3>${sorted.map(([k,v])=>`<div class="barline"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`)}else if(q.question_type==='multi_rating'){const sums={},counts={};arr.forEach(o=>Object.entries(o||{}).forEach(([k,v])=>{sums[k]=(sums[k]||0)+Number(v||0);counts[k]=(counts[k]||0)+1}));cards.push(`<div class="summary-q"><h3>${esc(q.label)}</h3>${Object.keys(sums).map(k=>`<div class="barline"><span>${esc(k)}</span><b>${(sums[k]/counts[k]).toFixed(1)}/5</b></div>`).join('')}</div>`)}else{const filled=arr.filter(v=>String(v).trim()).length;cards.push(`<div class="summary-q"><h3>${esc(q.label)}</h3><b>${filled}</b> <span class="muted">resposta(s) em texto/voz</span></div>`)}}
summaryContent.innerHTML=cards.join('')||'<div class="muted">Ainda não há respostas suficientes para consolidar.</div>';answersSummary.classList.toggle('hidden',submittedIds.size===0)}
function render(){const name=norm(nameFilter.value),mom=momentFilter.value,cat=categoryFilter.value,club=clubFilter.value,status=statusFilter.value;const rows=allRows.filter(x=>{const a=x.athlete_submissions||{};return(!name||norm(a.athlete_name).includes(name))&&(!mom||(x.moments||[]).includes(mom))&&(!cat||a.category===cat)&&(!club||x.club===club)&&(!status||(status==='done'?!!x.submitted_at:!x.submitted_at))});const done=rows.filter(x=>x.submitted_at).length;stats.innerHTML=`<div class="stats"><div class="stat"><b>${rows.length}</b><span>atletas</span></div><div class="stat"><b>${done}</b><span>respostas</span></div><div class="stat"><b>${rows.length?Math.round(done*100/rows.length):0}%</b><span>participação</span></div></div>`;list.innerHTML=rows.map(x=>{const a=x.athlete_submissions||{},n=a.athlete_name||'Atleta',statusHtml=x.submitted_at?scienceStatusHtml(x.id):'';return `<div class="item" data-invite-id="${esc(x.id)}"><b>${esc(n)}</b> <span class="muted">${esc(a.category||'')}${x.club?' · '+esc(x.club):''}${x.moments?.length?' · '+esc(x.moments.join(', ')):''}</span><div class="${x.submitted_at?'done':'muted'}">${x.submitted_at?'✓ Respondida':'Ainda não respondeu'}</div>${statusHtml}<div class="actions">${x.submitted_at?`<button class="btn primary" onclick="viewAnswers('${x.id}')">Ver respostas</button>`:''}<button class="btn secondary" onclick='copyMsg(${JSON.stringify(x.public_token)},${JSON.stringify(n)})'>Copiar mensagem</button><button class="btn ${x.submitted_at?'secondary':'primary'}" onclick='openWa(${JSON.stringify(x.public_token)},${JSON.stringify(n)},${JSON.stringify(a.guardian_whatsapp||'')})'>Abrir WhatsApp</button></div></div>`}).join('')||'Nenhum atleta encontrado com estes filtros.'}
function visibleAnsweredIds(){return [...list.querySelectorAll('.item[data-invite-id]')].map(el=>el.dataset.inviteId).filter(id=>allRows.find(x=>x.id===id)?.submitted_at)}
function scienceBoxHtml(id){const receipts=receiptList(id),byName=new Map(receipts.map(r=>[r.reader_name,r]));const readers=SCIENCE_NAMES.map(name=>{const r=byName.get(name);return r?`<div><span class="science-ok">✓ ${esc(name)}</span>${r.read_at?` <span class="muted">· ${esc(fmtReadAt(r.read_at))}</span>`:''}</div>`:`<div><span class="science-pending">○ ${esc(name)} · pendente</span></div>`}).join('');const mine=hasReceipt(id);return `<div class="science-box"><div class="science-title">Ciência da equipe</div><div class="science-readers">${readers}</div><div class="science-actions">${mine?`<button class="btn success" disabled>✓ Ciência registrada</button>`:`<button class="btn primary" onclick="giveScience('${id}')">Dar ciência</button>`}</div></div>`}
window.viewAnswers=async id=>{const row=allRows.find(x=>x.id===id);if(!row)return;currentAnswerId=id;const a=row.athlete_submissions||{};$('modalName').textContent=a.athlete_name||'Atleta';$('modalMeta').textContent=[a.category,row.club,(row.moments||[]).join(', ')].filter(Boolean).join(' · ');const amap=new Map(answers.filter(x=>x.invitation_id===id).map(x=>[x.question_id,x.answer])),audioMap=new Map(audios.filter(x=>x.invitation_id===id).map(x=>[x.question_id,x]));let html=scienceBoxHtml(id);for(const q of questions){const v=amap.get(q.id),au=audioMap.get(q.id);let audioHtml='';if(au?.audio_path){const s=await sb.storage.from('family-survey-audio').createSignedUrl(au.audio_path,3600);if(s.data?.signedUrl)audioHtml=`<audio controls src="${esc(s.data.signedUrl)}"></audio><div class="muted">Resposta em áudio${au.audio_duration_seconds?` · ${au.audio_duration_seconds}s`:''}</div>`}html+=`<div class="answer"><h3>${q.position}. ${esc(q.label)}</h3><div class="answer-value">${q.question_type==='rating'&&v?`<span class="rating">${esc(v)} / 5</span>`:esc(answerText(v))}</div>${audioHtml}</div>`}const ids=visibleAnsweredIds(),idx=ids.indexOf(id);html+=`<div class="answer-nav"><button class="btn secondary prev" onclick="navigateAnswers(-1)" ${idx<=0?'disabled':''}>← Anterior</button><div class="navpos">${idx>=0?`${idx+1} de ${ids.length}`:''}</div><button class="btn primary next" onclick="navigateAnswers(1)" ${idx<0||idx>=ids.length-1?'disabled':''}>Próximo →</button></div>`;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');$('modal').scrollTop=0}
window.giveScience=async id=>{if(!currentUser)return;const payload={invitation_id:id,user_id:currentUser.id,reader_name:currentReaderName,read_at:new Date().toISOString()};const {error}=await sb.from('event_survey_read_receipts').upsert(payload,{onConflict:'invitation_id,user_id'});if(error){alert('Não foi possível registrar a ciência: '+error.message);return}readReceipts=readReceipts.filter(r=>!(r.invitation_id===id&&r.user_id===currentUser.id));readReceipts.push(payload);render();await viewAnswers(id)}
window.navigateAnswers=dir=>{const ids=visibleAnsweredIds(),idx=ids.indexOf(currentAnswerId),next=ids[idx+dir];if(next)viewAnswers(next)};
function closeAnswers(){const id=currentAnswerId;$('modal').classList.add('hidden');requestAnimationFrame(()=>{const el=list.querySelector(`.item[data-invite-id="${CSS.escape(id||'')}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})})}
$('closeModal').onclick=closeAnswers;$('modal').onclick=e=>{if(e.target===$('modal'))closeAnswers()};eventSel.onchange=load;[nameFilter,momentFilter,categoryFilter,clubFilter,statusFilter].forEach(x=>x.addEventListener(x===nameFilter?'input':'change',render));
async function load(){const eid=eventSel.value;if(!eid)return;list.textContent='Carregando...';const s=await sb.from('event_surveys').select('id').eq('event_id',eid).maybeSingle();if(s.error||!s.data){summary.classList.add('hidden');answersSummary.classList.add('hidden');list.textContent='Este evento ainda não possui pesquisa.';return}const [r,m,q,an,au,rr]=await Promise.all([sb.from('event_survey_invitations').select('id,public_token,submitted_at,event_participant_id,athlete_id,athlete_submissions(athlete_name,category,club_name,club_other,guardian_whatsapp)').eq('survey_id',s.data.id),sb.from('event_moments').select('id,name,event_moment_athletes(event_participant_id)').eq('event_id',eid),sb.from('event_survey_questions').select('id,position,label,question_type').eq('survey_id',s.data.id).eq('active',true).order('position'),sb.from('event_survey_answers').select('invitation_id,question_id,answer'),sb.from('event_survey_audio_answers').select('invitation_id,question_id,audio_path,audio_duration_seconds'),sb.from('event_survey_read_receipts').select('invitation_id,user_id,reader_name,read_at')]);if(r.error||m.error||q.error||an.error||au.error||rr.error)return alert((r.error||m.error||q.error||an.error||au.error||rr.error).message);questions=q.data||[];const inviteIds=new Set((r.data||[]).map(x=>x.id));answers=(an.data||[]).filter(x=>inviteIds.has(x.invitation_id));audios=(au.data||[]).filter(x=>inviteIds.has(x.invitation_id));readReceipts=(rr.data||[]).filter(x=>inviteIds.has(x.invitation_id));const momentMap={};(m.data||[]).forEach(mm=>(mm.event_moment_athletes||[]).forEach(a=>{(momentMap[a.event_participant_id]??=[]).push(mm.name)}));allRows=(r.data||[]).map(x=>{const a=x.athlete_submissions||{};return {...x,club:a.club_name==='Outro'?(a.club_other||'Outro'):(a.club_name||a.club_other||''),moments:momentMap[x.event_participant_id]||[]}}).sort((x,y)=>(x.athlete_submissions?.athlete_name||'').localeCompare(y.athlete_submissions?.athlete_name||'','pt-BR',{sensitivity:'base'}));setOptions(momentFilter,allRows.flatMap(x=>x.moments),'Todas');setOptions(categoryFilter,allRows.map(x=>x.athlete_submissions?.category),'Todas');setOptions(clubFilter,allRows.map(x=>x.club),'Todos');nameFilter.value='';statusFilter.value='';summary.classList.remove('hidden');aggregate();render()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');currentUser=session.user;const email=String(currentUser.email||'').toLowerCase();currentReaderName=ADMIN_NAME_BY_EMAIL[email]||email.split('@')[0]||'Administrador';const e=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});eventSel.innerHTML='<option value="">Selecione...</option>'+(e.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.start_date||'')}</option>`).join('')}
init();
</script>
</body>
</html>
