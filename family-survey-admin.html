<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Pesquisa das famílias</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dce4ee;--muted:#68758a;--green:#177245}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#20314b}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:900px;margin:auto}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:16px 12px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.muted{color:var(--muted);font-size:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f7f9fc;border-radius:12px;padding:12px;min-width:130px}.stat b{display:block;font-size:22px;color:var(--n)}.item{border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}.done{color:var(--green);font-weight:900}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#eaf0f7;color:var(--n)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.hidden{display:none!important}</style></head><body><header><div class="wrap"><div class="brand">su<b>BT</b>o Experience</div><div>Pesquisa das famílias</div></div></header><main class="wrap"><div class="card"><label><b>Evento</b><select id="eventSel"><option value="">Selecione...</option></select></label></div><div id="summary" class="card hidden"></div><div id="list" class="card muted">Selecione o evento.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function url(t){return `${location.origin}/family-survey.html?t=${t}`}window.copyMsg=async(t,name)=>{const u=url(t),msg=`Olá! Queremos ouvir você e também ${name} sobre o suBTo Experience. É uma pesquisa rápida, de menos de 1 minuto. Este link é exclusivo da pesquisa referente a ${name}: ${u}`;await navigator.clipboard.writeText(msg);alert('Mensagem copiada.')} ;window.openWa=(t,name,phone)=>{const u=url(t),msg=`Olá! Queremos ouvir você e também ${name} sobre o suBTo Experience. É uma pesquisa rápida, de menos de 1 minuto. Este link é exclusivo da pesquisa referente a ${name}: ${u}`;const p=String(phone||'').replace(/\D/g,'');window.open(`https://wa.me/${p?('55'+p.replace(/^55/,'')):''}?text=${encodeURIComponent(msg)}`,'_blank')};eventSel.onchange=load;async function load(){const eid=eventSel.value;if(!eid)return;const s=await sb.from('event_surveys').select('id').eq('event_id',eid).maybeSingle();if(s.error||!s.data){summary.classList.add('hidden');list.textContent='Este evento ainda não possui pesquisa.';return}const r=await sb.from('event_survey_invitations').select('id,public_token,submitted_at,athlete_id,athlete_submissions(athlete_name,category,guardian_whatsapp)').eq('survey_id',s.data.id).order('created_at');if(r.error)return alert(r.error.message);const rows=r.data||[],done=rows.filter(x=>x.submitted_at).length;summary.classList.remove('hidden');summary.innerHTML=`<div class="stats"><div class="stat"><b>${rows.length}</b><span>atletas</span></div><div class="stat"><b>${done}</b><span>respostas</span></div><div class="stat"><b>${rows.length?Math.round(done*100/rows.length):0}%</b><span>participação</span></div></div>`;list.innerHTML=rows.map(x=>{const a=x.athlete_submissions||{},n=a.athlete_name||'Atleta';return `<div class="item"><b>${esc(n)}</b> <span class="muted">${esc(a.category||'')}</span><div class="${x.submitted_at?'done':'muted'}">${x.submitted_at?'✓ Respondida':'Ainda não respondeu'}</div><div class="actions"><button class="btn secondary" onclick='copyMsg(${JSON.stringify(x.public_token)},${JSON.stringify(n)})'>Copiar mensagem</button><button class="btn primary" onclick='openWa(${JSON.stringify(x.public_token)},${JSON.stringify(n)},${JSON.stringify(a.guardian_whatsapp||'')})'>Abrir WhatsApp</button></div></div>`}).join('')||'Nenhum atleta.'}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const e=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});eventSel.innerHTML='<option value="">Selecione...</option>'+(e.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.start_date||'')}</option>`).join('')}init();</script></body></html>
