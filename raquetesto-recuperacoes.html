<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaquetesTO — Recuperações</title><style>:root{--n:#0d1321;--l:#a6e22e;--b:#f5f6f8;--m:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Arial,sans-serif;color:var(--n)}header{background:var(--n);color:#fff;padding:16px}.wrap{max-width:760px;margin:auto}main{padding:18px 14px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 6px}.muted{color:var(--m);font-size:13px;line-height:1.45}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin:8px 0}button,a{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--l);color:var(--n)}.secondary{background:#eef1f4;color:var(--n)}.whatsapp{background:#25d366;color:#062b16}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.code{font-size:20px;font-weight:900}.status{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef1f4;font-weight:900}.temp{font-family:monospace;font-size:21px;font-weight:900;background:#f4f9e8;border:1px solid #cde783;border-radius:10px;padding:10px;margin:10px 0}</style></head><body><header><div class="wrap"><strong style="font-size:23px">Raquetes<span style="color:#a6e22e">TO</span></strong><div style="font-size:11px;letter-spacing:1px;color:#d0d5dd">RECUPERAÇÃO DE ACESSOS</div></div></header><main class="wrap"><section id="login" class="box"><h1>Acesso administrativo</h1><p class="muted">Use um e-mail administrativo autorizado. O link de acesso será enviado por e-mail.</p><input id="email" type="email" placeholder="seu@email.com"><button class="primary" style="width:100%" onclick="sendLink()">Enviar link de acesso</button><div id="loginMsg" class="muted"></div></section><section id="panel" class="hidden"><div class="box"><div class="row" style="justify-content:space-between"><div><h1>Recuperações</h1><div id="who" class="muted"></div></div><div class="row"><button class="secondary" onclick="load()">Atualizar</button><button class="secondary" onclick="logout()">Sair</button></div></div></div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://jaclntjjlzoumzkoiqgv.supabase.co',KEY='sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x',FN=URL+'/functions/v1/raquetesto-recovery-admin';const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);async function sendLink(){const email=$('email').value.trim();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('loginMsg').textContent=error?error.message:'Confira seu e-mail para entrar.'}async function logout(){await sb.auth.signOut();location.reload()}async function call(body){const {data:{session}}=await sb.auth.getSession();if(!session)return{error:'Sessão administrativa necessária.'};const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify(body)});return await r.json()}function phone(v){const d=String(v||'').replace(/\D/g,'');return d.startsWith('55')?d:'55'+d}async function approve(id){const x=await call({action:'approve',id});if(x.error){alert(x.error);return}const card=document.getElementById('r-'+id);const u=Array.isArray(x.user)?x.user[0]:x.user;const msg=`Olá! Sua recuperação do RaquetesTO foi aprovada.%0A%0ASolicitação: ${encodeURIComponent(x.request_code)}%0ASenha provisória: *${encodeURIComponent(x.temporary_password)}*%0A%0AEntre no RaquetesTO com seu celular e essa senha. O sistema pedirá que você crie uma nova senha.`;card.innerHTML+=`<div class="temp">${x.temporary_password}</div><a class="whatsapp" href="https://wa.me/${phone(u?.whatsapp)}?text=${msg}">Responder pelo WhatsApp</a>`}async function load(){const x=await call({action:'list'});if(x.error){$('list').innerHTML='<div class="box">'+x.error+'</div>';return}if(!x.data?.length){$('list').innerHTML='<div class="box">Nenhuma recuperação pendente.</div>';return}$('list').innerHTML=x.data.map(r=>{const u=Array.isArray(r.raquetesto_users)?r.raquetesto_users[0]:r.raquetesto_users;return `<div class="card" id="r-${r.id}"><div class="row" style="justify-content:space-between"><div class="code">${r.request_code}</div><span class="status">${r.status}</span></div><strong>${u?.name||''}</strong><div class="muted">${u?.whatsapp||''} · ${new Date(r.created_at).toLocaleString('pt-BR')}</div>${r.status==='pending'?`<button class="primary" style="margin-top:12px" onclick="approve('${r.id}')">Gerar acesso provisório</button>`:'<div class="muted" style="margin-top:10px">Acesso provisório já gerado.</div>'}</div>`}).join('')}async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=session.user.email||'';load()}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden')}}sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();</script></body></html>
