<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>suBTo — Conciliação das Inscrições</title><style>:root{--n:#082657;--o:#f28a00;--bg:#f5f7fa;--line:#dde4ed;--muted:#68758a;--green:#177245;--red:#a33a3a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1f2f49}header{background:linear-gradient(135deg,var(--n),#104488);color:#fff;padding:20px 15px}.wrap{max-width:900px;margin:auto}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900}.brand b{color:var(--o)}main{padding:18px 14px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#eaf0f7;color:var(--n)}select,input{width:100%;padding:9px;border:1px solid #ccd6e3;border-radius:9px;font:inherit}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-weight:800}.metric b{font-size:20px;color:var(--n)}.muted{color:var(--muted);font-size:12px}.warning{background:#fff7e6;border:1px solid #f5d08a;color:#7a5300;border-radius:10px;padding:11px;margin-top:12px}.ok{background:#edf9f2;border-color:#bfe3ce;color:#17643e}.hidden{display:none!important}.person{display:grid;grid-template-columns:minmax(180px,1fr) 120px minmax(280px,1.5fr);gap:12px;align-items:center}.person-name{font-weight:900;color:var(--n);font-size:15px}.amount{font-weight:900}.choices{display:flex;gap:6px;flex-wrap:wrap}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:block;padding:8px 10px;border:1px solid #cbd5e1;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer;background:#fff}.choice input:checked+span{background:var(--n);border-color:var(--n);color:#fff}.note{margin-top:8px}.saved{font-size:11px;color:var(--green);font-weight:800;margin-top:5px}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.person{grid-template-columns:1fr}.top{align-items:flex-start}.amount{margin-top:-5px}.choices{gap:5px}.choice span{padding:9px 11px}}</style></head><body><header><div class="wrap top"><div><div class="brand">su<b>BT</b>o Experience</div><div>Conciliação das Inscrições</div></div><a id="back" class="btn secondary" href="./accountability.html">Voltar à prestação</a></div></header><main class="wrap"><section class="card"><b>Evento</b><select id="eventSel"><option value="">Selecione...</option></select></section><div id="area" class="hidden"><section class="card"><h2 style="margin-top:0">Recebimentos das inscrições</h2><p class="muted">Atualize livremente os recebimentos. Esta tela não encerra nem reabre o evento.</p><div class="metrics"><div class="metric"><small>Inscritos</small><b id="mCount">0</b></div><div class="metric"><small>Previsto</small><b id="mExpected">R$ 0,00</b></div><div class="metric"><small>Gratuidades</small><b id="mFree">R$ 0,00</b></div><div class="metric"><small>Recebido</small><b id="mPaid">R$ 0,00</b></div><div class="metric"><small>Pendente</small><b id="mPending">R$ 0,00</b></div></div><div id="warning" class="warning"></div></section><div id="people"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const $=id=>document.getElementById(id);let events=[],ev=null,parts=[],athletes={};const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function val(p){return Number(p.charged_amount??ev?.price??0)}function normalized(s){s=(s||'Pendente').toLowerCase();if(s.includes('grat'))return'Gratuidade';if(s.includes('pag'))return'Pago';return'Pendente'}function calc(){let expected=0,free=0,paid=0,pending=0;for(const p of parts){const v=val(p),s=normalized(p.payment_status);expected+=v;if(s==='Gratuidade')free+=v;else if(s==='Pago')paid+=v;else pending+=v}mCount.textContent=parts.length;mExpected.textContent=money(expected);mFree.textContent=money(free);mPaid.textContent=money(paid);mPending.textContent=money(pending);warning.className='warning '+(pending?'':'ok');warning.textContent=pending?`${money(pending)} ainda pendente de recebimento.`:'Todas as inscrições devidas estão recebidas.'}function personHtml(p){const a=athletes[p.athlete_id]||{},s=normalized(p.payment_status),id=p.id;return `<section class="card person"><div><div class="person-name">${esc(a.athlete_name||'Atleta')}</div><div class="muted">${esc(a.category||'')}</div></div><div><div class="muted">Valor da inscrição</div><div class="amount">${money(val(p))}</div></div><div><div class="choices">${['Pago','Pendente','Gratuidade'].map(x=>`<label class="choice"><input type="radio" name="st-${id}" value="${x}" ${s===x?'checked':''} onchange="changeStatus('${id}','${x}')"><span>${x}</span></label>`).join('')}</div><div id="noteBox-${id}" class="note ${s==='Gratuidade'?'':'hidden'}"><input id="note-${id}" value="${esc(p.payment_note||'')}" placeholder="Motivo da gratuidade" onblur="saveOne('${id}')"></div><div id="saved-${id}" class="saved"></div></div></section>`}function render(){people.innerHTML=parts.map(personHtml).join('');calc()}window.changeStatus=async(id,s)=>{const p=parts.find(x=>x.id===id);if(!p)return;p.payment_status=s;const box=$(`noteBox-${id}`);box.classList.toggle('hidden',s!=='Gratuidade');calc();if(s!=='Gratuidade')await saveOne(id)};window.saveOne=async id=>{const p=parts.find(x=>x.id===id);if(!p)return;const input=$(`note-${id}`),note=input?input.value.trim():(p.payment_note||'');if(normalized(p.payment_status)==='Gratuidade'&&!note){alert('Informe o motivo da gratuidade.');return}const r=await sb.from('event_participants').update({charged_amount:val(p),payment_status:normalized(p.payment_status),payment_note:note||null,payment_confirmed_at:normalized(p.payment_status)==='Pago'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id).select().single();if(r.error)return alert(r.error.message);Object.assign(p,r.data);const s=$(`saved-${id}`);if(s){s.textContent='Salvo';setTimeout(()=>s.textContent='',1500)}calc()};async function loadEvent(id){ev=events.find(x=>x.id===id);if(!ev){area.classList.add('hidden');return}const r=await sb.from('event_participants').select('*').eq('event_id',id).eq('participant_type','athlete').order('created_at');if(r.error)return alert(r.error.message);parts=r.data||[];const ids=[...new Set(parts.map(x=>x.athlete_id).filter(Boolean))];athletes={};if(ids.length){const a=await sb.from('athlete_submissions').select('id,athlete_name,category').in('id',ids);if(a.error)return alert(a.error.message);for(const x of a.data||[])athletes[x.id]=x}area.classList.remove('hidden');render()}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('./login.html');const{data:ok}=await sb.rpc('is_admin');if(!ok)return location.replace('./login.html');const r=await sb.from('events').select('id,name,start_date,price').order('start_date',{ascending:false});if(r.error)return alert(r.error.message);events=r.data||[];eventSel.innerHTML='<option value="">Selecione...</option>'+events.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.start_date||'')}</option>`).join('');eventSel.onchange=()=>loadEvent(eventSel.value);const q=new URLSearchParams(location.search).get('event');if(q&&events.some(e=>e.id===q)){eventSel.value=q;await loadEvent(q);back.href=`./accountability.html?event=${encodeURIComponent(q)}`}}init();</script></body></html>
