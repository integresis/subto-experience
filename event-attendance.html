<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Lista da Turma</title><style>:root{--n:#082657;--o:#f28a00;--ink:#20314b;--muted:#68758a;--line:#d8e0ea;--bg:#eef2f6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.toolbar,.picker,.attendance{width:min(297mm,96vw);margin:14px auto}.toolbar,.picker{display:flex;gap:8px;align-items:end}.toolbar{justify-content:flex-end}.picker{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;flex-wrap:wrap}.picker label{flex:1;min-width:220px}.picker span{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:var(--n)}select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#fff;color:var(--n);border:1px solid var(--line)}.print-option{display:flex!important;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;font-size:12px;font-weight:700}.print-option input{width:18px;height:18px}.print-option span{display:inline;margin:0;color:var(--ink)}.attendance{background:#fff;padding:10mm 11mm;box-shadow:0 12px 35px #0002}.head{display:flex;justify-content:space-between;border-bottom:3px solid var(--n);padding-bottom:4mm;margin-bottom:4mm}.brand{font-size:25px;font-weight:900;color:var(--n)}.brand b{color:var(--o)}h1{font-size:22px;margin:2px 0;color:var(--n)}.meta{text-align:right;font-size:12px;color:var(--muted)}.info{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr .8fr;gap:5px;margin-bottom:4mm}.info div{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:11px}.info strong{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}table{width:100%;border-collapse:collapse;font-size:10.5px}th{background:#f0f4f9;color:var(--n);font-size:9px;text-transform:uppercase}th,td{border:1px solid #cfd8e4;padding:4px 5px;text-align:left;vertical-align:middle}.num{width:8mm;text-align:center}.photo-col{width:27mm;text-align:center}.list-photo,.photo-placeholder{width:23mm;height:23mm;border-radius:50%;display:inline-block;vertical-align:middle}.list-photo{object-fit:cover;border:1px solid #cbd5e1}.photo-placeholder{background:#eef2f6;border:1px dashed #b8c3d1;color:#8491a3;font-size:8px;line-height:23mm}.pres{width:18mm;text-align:center}.obs{width:35mm}.check{display:inline-block;width:6mm;height:6mm;border:1.5px solid #718096}.foot{display:flex;justify-content:space-between;margin-top:3mm;color:var(--muted);font-size:9px}.loading,.error{width:min(900px,92vw);margin:40px auto;background:#fff;padding:20px;text-align:center}.athlete-pages{display:none}.athlete-sheet{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:14mm;box-shadow:0 12px 35px #0002}.a-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--n);padding-bottom:8mm;margin-bottom:8mm}.a-brand{font-size:28px;font-weight:900;color:var(--n)}.a-brand b{color:var(--o)}.a-meta{font-size:12px;color:#6b7587;text-align:right}.profile{display:flex;gap:8mm;align-items:center;margin-bottom:8mm}.profile img,.profile-placeholder{width:34mm;height:34mm;border-radius:50%;object-fit:cover;border:1px solid #d8dee8}.profile-placeholder{display:flex;align-items:center;justify-content:center;background:#eef2f6}.athlete-sheet h1{font-size:24px}.athlete-sheet h2{font-size:15px;color:var(--n);border-bottom:1px solid #d8dee8}.agrid{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm}.aitem{font-size:12px}.aitem strong{display:block;font-size:10px;color:#6b7587;text-transform:uppercase}.wide{grid-column:1/-1}.question{border:1px solid #d8dee8;border-radius:8px;padding:4mm;margin-top:3mm;font-size:12px;white-space:pre-wrap}@page{size:A4 landscape;margin:8mm}@media print{body{background:#fff}.toolbar,.picker,.loading,.error{display:none!important}.attendance{width:auto;margin:0;padding:0;box-shadow:none}.table-wrap{overflow:visible}thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}.athlete-pages.print-enabled{display:block}.athlete-sheet{break-before:page;break-after:page;box-shadow:none}}@media(max-width:760px){.attendance,.athlete-sheet{width:100%;margin:0;padding:16px;box-shadow:none}.head,.a-head{flex-direction:column}.meta,.a-meta{text-align:left}.info{grid-template-columns:1fr 1fr}.toolbar,.picker{width:100%;padding:0 10px}.picker{flex-direction:column}.table-wrap{overflow:auto}table{min-width:950px}.agrid{grid-template-columns:1fr}}</style></head><body><div class="toolbar"><a class="btn secondary" href="./events.html">Voltar para Eventos</a><button id="printBtn" class="btn primary" disabled>Imprimir / salvar PDF</button></div><div class="picker"><label><span>Evento</span><select id="eventSel"></select></label><label><span>Turma</span><select id="momentSel"></select></label><label class="print-option"><input id="includeSheets" type="checkbox"><span>Incluir também a ficha individual de cada atleta desta turma</span></label><button id="openBtn" class="btn primary">Abrir lista</button></div><div id="loading" class="loading">Carregando...</div><div id="error" class="error" hidden></div><main id="attendance"></main><section id="athletePages" class="athlete-pages"></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x'),$=id=>document.getElementById(id),qs=new URLSearchParams(location.search);let eventId=qs.get('event')||'',momentId=qs.get('moment')||'',rows=[],ev=null,mo=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),br=v=>{if(!v)return'—';let p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v},arena=r=>r.club_name==='Outro'?(r.club_other||'Outro'):(r.club_name||'—'),phone=v=>{let d=String(v||'').replace(/\D/g,'').slice(0,11);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`:(d||'—')};async function photo(p){if(!p)return'';let{data}=await sb.storage.from('athlete-photos').createSignedUrl(p,3600);return data?.signedUrl||''}function fail(x){$('loading').hidden=true;$('error').hidden=false;$('error').textContent=x}function item(k,v,w=false){return`<div class="aitem${w?' wide':''}"><strong>${esc(k)}</strong>${esc(v||'—')}</div>`}async function loadPicker(){let r=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});if(r.error)return fail(r.error.message);$('eventSel').innerHTML='<option value="">Selecione um evento</option>'+r.data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(eventId){$('eventSel').value=eventId;await loadMoments();$('momentSel').value=momentId}}async function loadMoments(){let id=$('eventSel').value||eventId;$('momentSel').innerHTML='<option value="">Selecione uma turma</option>';if(!id)return;let r=await sb.from('event_moments').select('id,name,start_time').eq('event_id',id).order('activity_date').order('start_time');if(r.error)return fail(r.error.message);$('momentSel').innerHTML+=$(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(String(x.start_time||'').slice(0,5))}</option>`).join('')}function row(r,i){return`<tr><td class="num">${i+1}</td><td class="photo-col">${r._photo?`<img class="list-photo" src="${esc(r._photo)}">`:'<span class="photo-placeholder">SEM FOTO</span>'}</td><td><b>${esc(r.athlete_name)}</b></td><td>${esc(r.category||'—')}</td><td>${esc(arena(r))}</td><td>${esc(r.guardian_name||'—')}</td><td>${esc(phone(r.guardian_whatsapp))}</td><td class="pres"><span class="check"></span></td><td class="obs"></td></tr>`}function renderAttendance(){$('attendance').className='attendance';$('attendance').innerHTML=`<div class="head"><div><div class="brand">su<b>BT</b>o Experience</div><h1>Lista de frequência da turma</h1></div><div class="meta"><b>${esc(ev.name)}</b><br>Gerada em ${new Date().toLocaleString('pt-BR')}</div></div><div class="info"><div><strong>Turma</strong>${esc(mo.name)}</div><div><strong>Data</strong>${esc(br(mo.activity_date||ev.start_date))}</div><div><strong>Horário</strong>${esc(String(mo.start_time||'').slice(0,5))}</div><div><strong>Local / quadra</strong>${esc(mo.location||ev.location||'—')}</div><div><strong>Atletas</strong>${rows.length}</div></div><div class="table-wrap"><table><thead><tr><th class="num">Nº</th><th class="photo-col">Foto</th><th>Atleta</th><th>Categoria</th><th>Arena / Clube</th><th>Responsável</th><th>WhatsApp</th><th class="pres">Presença</th><th class="obs">Observação</th></tr></thead><tbody>${rows.length?rows.map(row).join(''):'<tr><td colspan="9">Nenhum atleta alocado nesta turma.</td></tr>'}</tbody></table></div><div class="foot"><span>${esc(mo.name)} · ${esc(String(mo.start_time||'').slice(0,5))}</span><span>Total: ${rows.length} atletas</span></div>`}function sheet(r){return`<article class="athlete-sheet"><div class="a-head"><div><div class="a-brand">su<b>BT</b>o Experience</div><div>Ficha individual do atleta</div></div><div class="a-meta">${esc(br(mo.activity_date||ev.start_date))} · ${esc(mo.location||ev.location||'AABB Palmas')}</div></div><div class="profile">${r._photo?`<img src="${esc(r._photo)}">`:'<div class="profile-placeholder">SEM FOTO</div>'}<div><h1>${esc(r.athlete_name)}</h1><div>${esc(r.category)} · ${esc(arena(r))}</div></div></div><h2>Identificação</h2><div class="agrid">${item('Data de nascimento',br(r.birth_date))}${item('Categoria',r.category)}${item('Arena/Clube',arena(r))}${item('Status',r.status)}</div><h2>Histórico esportivo</h2><div class="agrid">${item('Tempo de Beach Tennis',r.beach_tennis_time)}${item('Treinos por semana',r.trainings_per_week)}${item('Duração média',r.training_duration)}${item('Professores regulares',r.regular_coaches)}${item('Participa de torneios',r.tournaments)}${item('Mão dominante',r.dominant_hand)}${item('Lado predominante',r.court_side)}${item('Outro esporte',r.other_sport?(r.other_sport_name||'Sim'):'Não')}</div><h2>Responsável</h2><div class="agrid">${item('Nome',r.guardian_name)}${item('WhatsApp',phone(r.guardian_whatsapp))}${item('E-mail',r.guardian_email,true)}</div><h2>Perguntas e observações</h2><div class="question">${esc(r.question_one||'—')}</div><div class="question">${esc(r.question_two||'—')}</div><div class="question">${esc(r.family_note||'—')}</div></article>`}function renderSheets(){let b=$('athletePages');b.classList.toggle('print-enabled',$('includeSheets').checked);b.innerHTML=$('includeSheets').checked?rows.map(sheet).join(''):''}async function render(){if(!eventId||!momentId)return;$('loading').hidden=false;let[e,m,l]=await Promise.all([sb.from('events').select('id,name,start_date,location').eq('id',eventId).single(),sb.from('event_moments').select('*').eq('id',momentId).eq('event_id',eventId).single(),sb.from('event_moment_athletes').select('event_participant_id').eq('moment_id',momentId)]);if(e.error||m.error||l.error)return fail((e.error||m.error||l.error).message);ev=e.data;mo=m.data;let ids=l.data.map(x=>x.event_participant_id),a=[];if(ids.length){let p=await sb.from('event_participants').select('athlete_id').in('id',ids).eq('event_id',eventId),aids=p.data.map(x=>x.athlete_id).filter(Boolean);if(aids.length){let q=await sb.from('athlete_submissions').select('*').in('id',aids).order('athlete_name');if(q.error)return fail(q.error.message);a=q.data}}rows=await Promise.all(a.map(async r=>({...r,_photo:await photo(r.photo_path)})));renderAttendance();renderSheets();$('loading').hidden=true;$('printBtn').disabled=false}async function init(){let{data:{session}}=await sb.auth.getSession();if(!session)return fail('Sua sessão administrativa não está ativa.');let{data:ok}=await sb.rpc('is_admin');if(!ok)return fail('Usuário não autorizado.');await loadPicker();await render()}$('eventSel').onchange=async()=>{eventId=$('eventSel').value;momentId='';await loadMoments()};$('momentSel').onchange=()=>momentId=$('momentSel').value;$('openBtn').onclick=()=>{eventId=$('eventSel').value;momentId=$('momentSel').value;if(!eventId||!momentId)return alert('Selecione o evento e a turma.');history.replaceState(null,'',`?event=${eventId}&moment=${momentId}`);render()};$('includeSheets').onchange=renderSheets;$('printBtn').onclick=()=>window.print();init();</script></body></html>
