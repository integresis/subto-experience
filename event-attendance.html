<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>suBTo — Lista da turma</title><style>:root{--n:#082657;--o:#f28a00;--line:#cfd8e4;--muted:#68758a}*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1f2f49;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.toolbar{width:min(297mm,96vw);margin:14px auto;display:flex;justify-content:flex-end;gap:8px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#fff;color:var(--n);border:1px solid var(--line)}.page{width:min(297mm,96vw);min-height:210mm;margin:0 auto 20px;background:#fff;padding:11mm;box-shadow:0 10px 30px #0002}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--n);padding-bottom:5mm}.brand{font-size:25px;font-weight:900;color:var(--n)}.brand b{color:var(--o)}h1{font-size:20px;margin:1mm 0 0;color:var(--n)}.meta{text-align:right;font-size:12px;line-height:1.55}.summary{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr .7fr;gap:3mm;margin:6mm 0}.item{border:1px solid var(--line);border-radius:6px;padding:3mm;font-size:12px}.item b{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:1mm}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #aeb9c7;padding:2.4mm;text-align:left;vertical-align:middle}th{background:#edf2f8;color:var(--n);font-size:10px;text-transform:uppercase}.num{width:10mm;text-align:center}.presence{width:20mm;text-align:center}.obs{width:43mm}.phone{white-space:nowrap}.empty,.error,.loading{text-align:center;padding:30px;color:var(--muted)}.foot{margin-top:4mm;font-size:9px;color:var(--muted);display:flex;justify-content:space-between}@media(max-width:750px){.page{width:100%;min-height:100vh;margin:0;padding:16px;box-shadow:none;overflow:auto}.summary{grid-template-columns:1fr 1fr}.toolbar{width:100%;padding:0 10px}.meta{text-align:left}.head{flex-direction:column}table{min-width:900px}}@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.toolbar,.loading,.error{display:none!important}.page{width:297mm;min-height:210mm;margin:0;padding:9mm;box-shadow:none}.foot{position:relative}}
</style></head><body><div class="toolbar"><button class="btn secondary" onclick="history.back()">Voltar</button><button id="printBtn" class="btn primary" disabled>Imprimir / salvar PDF</button></div><div id="loading" class="loading">Carregando lista da turma...</div><div id="error" class="error" hidden></div><main id="page" class="page" hidden></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');const qs=new URLSearchParams(location.search),eventId=qs.get('event'),momentId=qs.get('moment'),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function br(v){if(!v)return'—';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}function phone(v){const d=String(v||'').replace(/\D/g,'').slice(0,11);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`:(v||'—')}function arena(r){return r.club_name==='Outro'?(r.club_other||'Outro'):(r.club_name||'—')}function fail(m){$('loading').hidden=true;$('error').hidden=false;$('error').textContent=m}async function init(){if(!eventId||!momentId)return fail('Evento ou turma não identificados.');const{data:{session}}=await sb.auth.getSession();if(!session)return fail('Sua sessão administrativa não está ativa.');const{data:ok}=await sb.rpc('is_admin');if(!ok)return fail('Usuário sem autorização administrativa.');const[e,m]=await Promise.all([sb.from('events').select('id,name,start_date,location').eq('id',eventId).single(),sb.from('event_moments').select('*').eq('id',momentId).eq('event_id',eventId).single()]);if(e.error||m.error)return fail((e.error||m.error).message);const lr=await sb.from('event_moment_athletes').select('event_participant_id').eq('moment_id',momentId);if(lr.error)return fail(lr.error.message);const pids=(lr.data||[]).map(x=>x.event_participant_id);let rows=[];if(pids.length){const pr=await sb.from('event_participants').select('id,athlete_id').eq('event_id',eventId).in('id',pids);if(pr.error)return fail(pr.error.message);const aids=(pr.data||[]).map(x=>x.athlete_id).filter(Boolean);if(aids.length){const ar=await sb.from('athlete_submissions').select('id,athlete_name,category,club_name,club_other,guardian_name,guardian_whatsapp').in('id',aids).order('athlete_name');if(ar.error)return fail(ar.error.message);rows=ar.data||[]}}const ev=e.data,mo=m.data;$('page').innerHTML=`<div class="head"><div><div class="brand">su<b>BT</b>o Experience</div><h1>Lista de frequência da turma</h1></div><div class="meta"><b>${esc(ev.name)}</b><br>${esc(mo.name)}</div></div><div class="summary"><div class="item"><b>Turma</b>${esc(mo.name)}</div><div class="item"><b>Data</b>${esc(br(mo.activity_date))}</div><div class="item"><b>Horário</b>${esc(String(mo.start_time||'').slice(0,5))}</div><div class="item"><b>Local / quadra</b>${esc(mo.location||ev.location||'—')}</div><div class="item"><b>Atletas</b>${rows.length}</div></div>${rows.length?`<table><thead><tr><th class="num">Nº</th><th>Atleta</th><th>Categoria</th><th>Arena / Clube</th><th>Responsável</th><th>WhatsApp</th><th class="presence">Presença</th><th class="obs">Observação</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(r.athlete_name)}</b></td><td>${esc(r.category||'—')}</td><td>${esc(arena(r))}</td><td>${esc(r.guardian_name||'—')}</td><td class="phone">${esc(phone(r.guardian_whatsapp))}</td><td class="presence">☐</td><td></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum atleta alocado nesta turma.</div>'}<div class="foot"><span>Lista gerada a partir dos atletas alocados nesta turma.</span><span>Gerada em ${new Date().toLocaleString('pt-BR')}</span></div>`;$('loading').hidden=true;$('page').hidden=false;$('printBtn').disabled=false}$('printBtn').onclick=()=>window.print();init();
</script></body></html>
