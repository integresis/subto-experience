<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>suBTo — Lista da Turma</title>
<style>
:root{--n:#082657;--o:#f28a00;--ink:#20314b;--muted:#68758a;--line:#d8e0ea;--bg:#eef2f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.toolbar,.picker{width:min(297mm,96vw);margin:14px auto;display:flex;gap:8px;align-items:end}.toolbar{justify-content:flex-end}.picker{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;align-items:end;flex-wrap:wrap}.picker label{flex:1;min-width:220px}.picker span{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:var(--n)}select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--o);color:#fff}.secondary{background:#fff;color:var(--n);border:1px solid var(--line)}.print-option{display:flex!important;align-items:center;gap:9px;min-width:300px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;font-size:12px;font-weight:700;color:var(--ink)}.print-option input{width:18px;height:18px;accent-color:var(--o)}.print-option span{display:inline;margin:0;color:var(--ink);font-size:12px}.page{width:min(297mm,96vw);min-height:210mm;margin:0 auto 22px;background:#fff;padding:10mm 11mm;box-shadow:0 12px 35px #0002}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--n);padding-bottom:5mm;margin-bottom:5mm}.brand{font-size:25px;font-weight:900;color:var(--n)}.brand b{color:var(--o)}h1{font-size:22px;margin:2px 0;color:var(--n)}.meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.55}.info{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr .8fr;gap:5px;margin-bottom:5mm}.info div{border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:11px}.info strong{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}table{width:100%;border-collapse:collapse;font-size:10.5px}th{background:#f0f4f9;color:var(--n);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em}th,td{border:1px solid #cfd8e4;padding:6px 5px;text-align:left;vertical-align:middle}td.num,th.num{width:8mm;text-align:center}td.pres,th.pres{width:19mm;text-align:center}td.obs,th.obs{width:40mm}.check{display:inline-block;width:6mm;height:6mm;border:1.5px solid #718096;border-radius:2px}.foot{display:flex;justify-content:space-between;margin-top:4mm;color:var(--muted);font-size:9.5px}.loading,.error{width:min(900px,92vw);margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}.error{color:#8b1e1e;border-color:#efc6c6}.hidden{display:none!important}
.athlete-pages{display:none}.athlete-sheet{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:14mm;box-shadow:0 12px 35px #0002;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2f49}.athlete-sheet .a-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:3px solid var(--n);padding-bottom:8mm;margin-bottom:8mm}.athlete-sheet .a-brand{font-size:28px;font-weight:900;color:var(--n)}.athlete-sheet .a-brand b{color:var(--o)}.athlete-sheet .a-meta{font-size:12px;color:#6b7587;text-align:right}.athlete-sheet .profile{display:flex;gap:8mm;align-items:center;margin-bottom:8mm}.athlete-sheet .profile img{width:34mm;height:34mm;border-radius:50%;object-fit:cover;border:1px solid #d8dee8}.athlete-sheet h1{font-size:24px;margin:0;color:var(--n)}.athlete-sheet h2{font-size:15px;margin:8mm 0 3mm;color:var(--n);border-bottom:1px solid #d8dee8;padding-bottom:2mm}.athlete-sheet .agrid{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm}.athlete-sheet .aitem{font-size:12px;line-height:1.45}.athlete-sheet .aitem strong{display:block;font-size:10px;color:#6b7587;text-transform:uppercase;letter-spacing:.03em}.athlete-sheet .wide{grid-column:1/-1}.athlete-sheet .question{border:1px solid #d8dee8;border-radius:8px;padding:4mm;margin-top:3mm;font-size:12px;line-height:1.5;white-space:pre-wrap}
@media(max-width:760px){.page{width:100%;margin:0;padding:16px;box-shadow:none;overflow:auto}.head{flex-direction:column}.meta{text-align:left}.info{grid-template-columns:1fr 1fr}.toolbar,.picker{width:100%;padding:0 10px}.picker{flex-direction:column;align-items:stretch}.picker label,.print-option{min-width:0;width:100%}.table-wrap{overflow:auto}table{min-width:920px}.athlete-sheet{width:100%;min-height:100vh;margin:0;padding:20px;box-shadow:none}.athlete-sheet .agrid{grid-template-columns:1fr}.athlete-sheet .wide{grid-column:auto}.athlete-sheet .a-head{flex-direction:column}.athlete-sheet .a-meta{text-align:left}.athlete-sheet .profile{align-items:flex-start}.athlete-sheet .profile img{width:92px;height:92px}}
@page attendance{size:A4 landscape;margin:0}@page athlete{size:A4 portrait;margin:0}
@media print{body{background:#fff}.toolbar,.picker,.loading,.error{display:none!important}.page{page:attendance;width:297mm;min-height:210mm;margin:0;padding:9mm 10mm;box-shadow:none;break-after:page}.table-wrap{overflow:visible}table{min-width:0}.athlete-pages.print-enabled{display:block}.athlete-sheet{page:athlete;width:210mm;min-height:297mm;margin:0;padding:12mm;box-shadow:none;break-before:page;break-after:page}.athlete-sheet .profile img{width:32mm;height:32mm}}
</style>
</head>
<body>
<div class="toolbar"><a class="btn secondary" href="./events.html">Voltar para Eventos</a><button id="printBtn" class="btn primary" disabled>Imprimir / salvar PDF</button></div>
<div id="picker" class="picker"><label><span>Evento</span><select id="eventSel"><option value="">Selecione um evento</option></select></label><label><span>Turma</span><select id="momentSel"><option value="">Selecione uma turma</option></select></label><label class="print-option"><input id="includeSheets" type="checkbox"><span>Incluir também a ficha individual de cada atleta desta turma</span></label><button id="openBtn" class="btn primary">Abrir lista</button></div>
<div id="loading" class="loading">Carregando...</div>
<div id="error" class="error" hidden></div>
<main id="page" class="page" hidden></main>
<section id="athletePages" class="athlete-pages"></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://jaclntjjlzoumzkoiqgv.supabase.co','sb_publishable_J7Nega84MpJvAWYP-rA_Vg_nQV1m_0x');
const qs=new URLSearchParams(location.search);let eventId=qs.get('event')||'',momentId=qs.get('moment')||'',currentRows=[],currentEvent=null,currentMoment=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const digits=v=>String(v||'').replace(/\D/g,'');
function br(v){if(!v)return'—';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function phone(v){const d=digits(v).slice(0,11);if(!d)return'—';if(d.length<11)return d;return`(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`}
function arena(r){return r.club_name==='Outro'?(r.club_other||'Outro'):(r.club_name||'—')}
function fail(msg){$('loading').hidden=true;$('error').hidden=false;$('error').textContent=msg}
function item(label,value,wide=false){return`<div class="aitem${wide?' wide':''}"><strong>${esc(label)}</strong>${esc(value||'—')}</div>`}
async function signedPhoto(path){if(!path)return'';const{data}=await sb.storage.from('athlete-photos').createSignedUrl(path,3600);return data?.signedUrl||''}
async function loadPicker(){
 const er=await sb.from('events').select('id,name,start_date').order('start_date',{ascending:false});if(er.error)return fail(er.error.message);
 $('eventSel').innerHTML='<option value="">Selecione um evento</option>'+(er.data||[]).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
 if(eventId){$('eventSel').value=eventId;await loadMoments(eventId);if(momentId)$('momentSel').value=momentId}
}
async function loadMoments(id){$('momentSel').innerHTML='<option value="">Selecione uma turma</option>';if(!id)return;const r=await sb.from('event_moments').select('id,name,start_time').eq('event_id',id).order('activity_date').order('start_time');if(r.error)return fail(r.error.message);$('momentSel').innerHTML='<option value="">Selecione uma turma</option>'+(r.data||[]).map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(String(m.start_time||'').slice(0,5))}</option>`).join('')}
function athleteSheet(r,photo){return`<article class="athlete-sheet"><div class="a-head"><div><div class="a-brand">su<b>BT</b>o Experience</div><div>Ficha individual do atleta</div></div><div class="a-meta">29/08/2026 · AABB Palmas<br>Gerada em ${new Date().toLocaleString('pt-BR')}</div></div><div class="profile">${photo?`<img src="${esc(photo)}" alt="Foto do atleta">`:''}<div><h1>${esc(r.athlete_name)}</h1><div>${esc(r.category)} · ${esc(arena(r))}</div></div></div><h2>Identificação</h2><div class="agrid">${item('Data de nascimento',br(r.birth_date))}${item('Categoria',r.category)}${item('Arena/Clube',arena(r))}${item('Status',r.status)}</div><h2>Histórico esportivo</h2><div class="agrid">${item('Tempo de Beach Tennis',r.beach_tennis_time)}${item('Treinos por semana',r.trainings_per_week)}${item('Duração média',r.training_duration)}${item('Professores regulares',r.regular_coaches)}${item('Participa de torneios',r.tournaments)}${item('Mão dominante',r.dominant_hand)}${item('Lado predominante',r.court_side)}${item('Outro esporte',r.other_sport?(r.other_sport_name||'Sim'):'Não')}</div><h2>Responsável</h2><div class="agrid">${item('Nome',r.guardian_name)}${item('WhatsApp',phone(r.guardian_whatsapp))}${item('E-mail',r.guardian_email,true)}</div><h2>Perguntas e observações</h2><div class="question"><strong>Principal dúvida sobre o desenvolvimento do atleta</strong><br>${esc(r.question_one||'—')}</div><div class="question"><strong>Segunda dúvida para o treinador</strong><br>${esc(r.question_two||'—')}</div><div class="question"><strong>Observação da família</strong><br>${esc(r.family_note||'—')}</div></article>`}
async function renderAthletePages(){
 const box=$('athletePages');box.innerHTML='';box.classList.toggle('print-enabled',$('includeSheets').checked);
 if(!$('includeSheets').checked||!currentRows.length)return;
 $('loading').hidden=false;$('loading').textContent='Preparando fichas individuais...';
 const html=[];for(const r of currentRows){const photo=await signedPhoto(r.photo_path);html.push(athleteSheet(r,photo))}box.innerHTML=html.join('');$('loading').hidden=true;
}
async function renderList(){
 if(!eventId||!momentId){$('loading').hidden=true;$('page').hidden=true;$('printBtn').disabled=true;return}
 $('loading').hidden=false;$('loading').textContent='Carregando lista da turma...';$('error').hidden=true;
 const[e,m,l]=await Promise.all([
  sb.from('events').select('id,name,start_date,location').eq('id',eventId).single(),
  sb.from('event_moments').select('id,event_id,name,activity_date,location,start_time,duration_minutes,max_athletes').eq('id',momentId).eq('event_id',eventId).single(),
  sb.from('event_moment_athletes').select('event_participant_id').eq('moment_id',momentId)
 ]);
 if(e.error||m.error||l.error)return fail((e.error||m.error||l.error).message);
 const ids=(l.data||[]).map(x=>x.event_participant_id);let rows=[];
 if(ids.length){const p=await sb.from('event_participants').select('id,athlete_id').in('id',ids).eq('event_id',eventId);if(p.error)return fail(p.error.message);const aids=(p.data||[]).map(x=>x.athlete_id).filter(Boolean);if(aids.length){const a=await sb.from('athlete_submissions').select('*').in('id',aids).order('athlete_name');if(a.error)return fail(a.error.message);rows=a.data||[]}}
 currentRows=rows;currentEvent=e.data;currentMoment=m.data;const ev=currentEvent,mo=currentMoment;
 $('page').innerHTML=`<div class="head"><div><div class="brand">su<b>BT</b>o Experience</div><h1>Lista de frequência da turma</h1></div><div class="meta"><b>${esc(ev.name)}</b><br>Gerada em ${new Date().toLocaleString('pt-BR')}</div></div><div class="info"><div><strong>Turma</strong>${esc(mo.name)}</div><div><strong>Data</strong>${esc(br(mo.activity_date||ev.start_date))}</div><div><strong>Horário</strong>${esc(String(mo.start_time||'').slice(0,5))}</div><div><strong>Local / quadra</strong>${esc(mo.location||ev.location||'—')}</div><div><strong>Atletas</strong>${rows.length}</div></div><div class="table-wrap"><table><thead><tr><th class="num">Nº</th><th>Atleta</th><th>Categoria</th><th>Arena / Clube</th><th>Responsável</th><th>WhatsApp</th><th class="pres">Presença</th><th class="obs">Observação</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(r.athlete_name)}</b></td><td>${esc(r.category||'—')}</td><td>${esc(arena(r))}</td><td>${esc(r.guardian_name||'—')}</td><td>${esc(phone(r.guardian_whatsapp))}</td><td class="pres"><span class="check"></span></td><td class="obs"></td></tr>`).join(''):`<tr><td colspan="8" style="text-align:center;padding:16px">Nenhum atleta alocado nesta turma.</td></tr>`}</tbody></table></div><div class="foot"><span>${esc(mo.name)} · ${esc(String(mo.start_time||'').slice(0,5))}</span><span>Capacidade cadastrada: ${esc(mo.max_athletes||'—')}</span></div>`;
 $('loading').hidden=true;$('page').hidden=false;$('printBtn').disabled=false;await renderAthletePages();
}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return fail('Sua sessão administrativa não está ativa. Entre novamente pelo painel.');const{data:ok,error:ae}=await sb.rpc('is_admin');if(ae||!ok)return fail('Este usuário não está autorizado a visualizar esta lista.');await loadPicker();await renderList()}
$('eventSel').onchange=async()=>{eventId=$('eventSel').value;momentId='';await loadMoments(eventId)};$('momentSel').onchange=()=>momentId=$('momentSel').value;$('openBtn').onclick=()=>{eventId=$('eventSel').value;momentId=$('momentSel').value;if(!eventId||!momentId)return alert('Selecione o evento e a turma.');history.replaceState(null,'',`?event=${encodeURIComponent(eventId)}&moment=${encodeURIComponent(momentId)}`);renderList()};$('includeSheets').onchange=renderAthletePages;$('printBtn').onclick=async()=>{await renderAthletePages();window.print()};init();
</script>
</body>
</html>
